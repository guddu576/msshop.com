<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>MS Bag Shop ERP v8.4</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0a1628;
            --primary-light: #1a3050;
            --secondary: #d4a843;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --gold: #d4a843;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            --ai: #8b5cf6;
            --sidebar-width: 260px;
            --header-height: 60px;
            --red: #dc2626;
        }
        .dark-mode {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #2d3748;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 48px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* ===== LOGIN ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628, #1a3050);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(212, 168, 67, 0.05) 0%, transparent 70%);
            animation: rotateBg 60s linear infinite;
        }
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        .dark-mode .login-card {
            background: rgba(26, 26, 46, 0.97);
        }
        .login-card .logo {
            text-align: center;
            font-size: 4rem;
        }
        .login-card h2 {
            text-align: center;
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 700;
        }
        .dark-mode .login-card h2 {
            color: white;
        }
        .login-card h2 span {
            color: var(--gold);
        }
        .login-card .sub {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .login-card input,
        .login-card select {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .login-card input:focus,
        .login-card select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .login-card .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }
        .login-card .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(10, 22, 40, 0.3);
        }
        .login-error {
            color: #dc2626;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* ===== APP ===== */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--primary);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }
        .app-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .left .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .app-header .left .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .left .brand {
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .app-header .left .brand span {
            color: var(--gold);
        }
        .app-header .left .brand small {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: 4px;
        }
        .app-header .center {
            flex: 1;
            max-width: 400px;
            margin: 0 16px;
            position: relative;
            display: none;
        }
        .app-header .center input {
            width: 100%;
            padding: 8px 16px 8px 36px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 14px;
            transition: var(--transition);
        }
        .app-header .center input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .app-header .center input:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .app-header .center .icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        .app-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header .right .btn-icon {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            position: relative;
            transition: var(--transition);
        }
        .app-header .right .btn-icon:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        .app-header .right .btn-icon .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--danger);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }
        .app-header .right .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: var(--transition);
        }
        .app-header .right .user-info:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .app-header .right .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .app-header .right .user-info .name {
            color: white;
            font-size: 13px;
            font-weight: 500;
        }
        .app-header .right .user-info .role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
        }
        .app-header .right .shop-select {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 11px;
            cursor: pointer;
        }
        .app-header .right .shop-select option {
            color: var(--text);
            background: var(--card);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background: var(--card);
            z-index: 200;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.08);
            padding-top: var(--header-height);
            border-right: 1px solid var(--border);
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar .inner {
            padding: 8px 0 80px;
        }
        .sidebar .brand-side {
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar .brand-side h2 {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
        }
        .sidebar .brand-side h2 span {
            color: var(--gold);
        }
        .sidebar .brand-side .ver {
            font-size: 9px;
            color: var(--text-light);
        }
        .sidebar .nav-section {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-light);
            padding: 14px 20px 4px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .sidebar .nav-item {
            display: block;
            width: 100%;
            padding: 9px 20px;
            background: none;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-weight: 500;
        }
        .sidebar .nav-item:hover {
            background: var(--bg);
            color: var(--primary);
        }
        .sidebar .nav-item.active {
            background: var(--bg);
            border-left-color: var(--gold);
            color: var(--primary);
        }
        .sidebar .nav-item .icon {
            margin-right: 10px;
            font-size: 15px;
        }
        .sidebar .nav-item .badge-nav {
            float: right;
            background: var(--gold);
            color: white;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
        }
        .sidebar .nav-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 20px;
        }
        .sidebar .nav-logout {
            color: var(--danger) !important;
        }
        .sidebar .nav-logout:hover {
            background: #fee2e2 !important;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            display: none;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.show {
            display: block;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            padding-top: var(--header-height);
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 20px;
            max-width: 1440px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .page-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .page-header h1 small {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-light);
            margin-left: 6px;
        }
        .page-header .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-content {
            padding: 0 16px 16px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: none;
            justify-content: space-around;
            padding: 4px 0;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.08);
            z-index: 100;
            border-top: 1px solid var(--border);
        }
        .bottom-nav button {
            background: none;
            border: none;
            padding: 4px 6px;
            font-size: 9px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            cursor: pointer;
            transition: var(--transition);
        }
        .bottom-nav button .nav-icon {
            font-size: 18px;
        }
        .bottom-nav button.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== CARDS & GRIDS ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card);
            padding: 14px 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .stat-card .stat-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
        .stat-card .stat-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .stat-card .stat-value.gold {
            color: var(--gold);
        }
        .stat-card .stat-value.danger {
            color: var(--danger);
        }
        .stat-card .stat-value.success {
            color: var(--success);
        }
        .stat-card .stat-value.ai {
            color: var(--ai);
        }

        .section-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .section-card:hover {
            box-shadow: var(--shadow);
        }
        .section-card .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        .dark-mode .section-card .card-title {
            color: white;
        }
        .section-card .card-title .badge {
            background: var(--secondary);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .kpi-card {
            background: var(--card);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .kpi-card .kpi-label {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 600;
        }
        .kpi-card .kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 2px;
        }
        .kpi-card .kpi-value.gold {
            color: var(--gold);
        }
        .kpi-card .kpi-value.danger {
            color: var(--danger);
        }

        /* ===== FORMS ===== */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group label .req {
            color: var(--danger);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }
        .form-group input[readonly] {
            background: var(--border);
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .form-row-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
        }
        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #d1d5db;
            transform: translateY(-1px);
        }
        .btn-gold {
            background: var(--gold);
            color: white;
        }
        .btn-gold:hover {
            transform: translateY(-1px);
        }
        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }
        .btn-ai:hover {
            transform: translateY(-1px);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        table th,
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }
        table th {
            background: var(--bg);
            font-weight: 700;
            color: var(--text-light);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        table tr:hover td {
            background: var(--bg);
        }
        table .empty-row td {
            text-align: center;
            color: var(--text-light);
            padding: 24px;
        }

        /* ===== BADGES ===== */
        .badge-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-paid {
            background: var(--success);
            color: white;
        }
        .badge-pending {
            background: var(--warning);
            color: white;
        }
        .badge-overdue {
            background: var(--danger);
            color: white;
        }
        .badge-active {
            background: var(--success);
            color: white;
        }
        .badge-inactive {
            background: var(--danger);
            color: white;
        }
        .badge-low {
            background: var(--warning);
            color: white;
        }
        .badge-out {
            background: var(--danger);
            color: white;
        }
        .badge-partial {
            background: var(--ai);
            color: white;
        }
        .badge-dead {
            background: #6b7280;
            color: white;
        }

        /* ===== SEARCH ===== */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-bar input,
        .search-bar select {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            min-width: 100px;
            flex: 1;
        }
        .search-bar input:focus,
        .search-bar select:focus {
            border-color: var(--gold);
            outline: none;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .modal-header h3 {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-close:hover {
            background: var(--bg);
            transform: rotate(90deg);
        }
        .modal-body {
            max-height: calc(90vh - 120px);
            overflow-y: auto;
        }

        /* ===== TOAST ===== */
        .toast-message {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 999;
            font-weight: 600;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast-message.success {
            background: var(--success);
        }
        .toast-message.error {
            background: var(--danger);
        }
        .toast-message.warning {
            background: var(--warning);
        }
        .auto-save-indicator {
            position: fixed;
            bottom: 70px;
            right: 16px;
            background: var(--primary);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            z-index: 1000;
            box-shadow: var(--shadow);
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        .auto-save-indicator.saved {
            background: var(--success);
            transform: scale(1.05);
        }
        .auto-save-indicator.backup {
            background: var(--gold);
            color: var(--primary);
        }

        /* ===== GALLERY ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            background: var(--bg);
            aspect-ratio: 1;
            cursor: pointer;
            transition: var(--transition);
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow);
        }
        .gallery-item .img-wrap {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .gallery-item .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            text-align: center;
        }
        .gallery-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 12px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== GLARE EFFECT ON IMAGES ===== */
        .img-glare {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .img-glare::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            pointer-events: none;
            mix-blend-mode: overlay;
            animation: glareMove 6s infinite alternate;
        }
        @keyframes glareMove {
            0% { transform: translate(-10%, -10%) rotate(0deg); }
            100% { transform: translate(10%, 10%) rotate(5deg); }
        }
        .pos-product-card .img-wrap,
        .gallery-item .img-wrap,
        .product-thumb .img-wrap {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-sm);
        }
        .pos-product-card .img-wrap::after,
        .gallery-item .img-wrap::after,
        .product-thumb .img-wrap::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            pointer-events: none;
            mix-blend-mode: overlay;
            animation: glareMove 8s infinite alternate;
        }

        /* ===== IMAGE PREVIEW ===== */
        .image-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .image-preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-item .remove-img {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== RESULT ITEMS ===== */
        .result-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-item:hover {
            background: var(--bg);
        }

        /* ===== INVOICE PRINT ===== */
        .invoice-print {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .invoice-print .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .invoice-print .header .company h2 {
            color: var(--primary);
            font-size: 22px;
        }
        .invoice-print .header .company h2 span {
            color: var(--gold);
        }
        .invoice-print .header .company p {
            font-size: 12px;
            color: #666;
        }
        .invoice-print .header .meta {
            text-align: right;
            font-size: 13px;
        }
        .invoice-print .header .meta strong {
            color: var(--primary);
        }
        .invoice-print .customer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 13px;
        }
        .invoice-print .customer .label {
            color: #666;
            font-weight: 600;
        }
        .invoice-print table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
        }
        .invoice-print table th {
            background: var(--primary);
            color: white;
            padding: 6px 10px;
            font-size: 10px;
            text-transform: uppercase;
        }
        .invoice-print table td {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .invoice-print .totals {
            text-align: right;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 10px;
        }
        .invoice-print .totals div {
            padding: 3px 0;
            font-size: 14px;
        }
        .invoice-print .totals .grand {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
        }
        .invoice-print .footer {
            text-align: center;
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
        }

        /* ===== POS ===== */
        .pos-product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 8px;
            max-height: 260px;
            overflow-y: auto;
        }
        .pos-product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .pos-product-card:hover {
            transform: scale(1.03);
            border-color: var(--gold);
            box-shadow: var(--shadow);
        }
        .pos-product-card .img-wrap {
            width: 100%;
            height: 60px;
            overflow: hidden;
            border-radius: 4px;
            position: relative;
        }
        .pos-product-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .pos-product-card .p-name {
            font-size: 10px;
            font-weight: 600;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pos-product-card .p-price {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
        }
        .pos-product-card .p-stock {
            font-size: 9px;
            color: var(--text-light);
        }

        /* ===== PRINT STUDIO ===== */
        .print-studio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .print-studio-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .print-studio-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--gold);
        }
        .print-studio-card .ps-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }
        .print-studio-card .ps-name {
            font-size: 13px;
            font-weight: 600;
        }
        .print-studio-card .ps-desc {
            font-size: 10px;
            color: var(--text-light);
        }

        /* ===== PRICE LABEL ===== */
        .label-preview {
            background: white;
            padding: 20px;
            border-radius: var(--radius-sm);
            border: 1px solid #ddd;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: var(--shadow);
        }
        .label-preview .label-header {
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .label-preview .label-header .store-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }
        .label-preview .label-header .store-logo {
            font-size: 28px;
        }
        .label-preview .label-product {
            text-align: center;
        }
        .label-preview .label-product .product-image {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }
        .label-preview .label-product .product-name {
            font-size: 16px;
            font-weight: 700;
            margin-top: 6px;
        }
        .label-preview .label-product .brand-name {
            font-size: 12px;
            color: #666;
        }
        .label-preview .label-product .sku-code {
            font-size: 10px;
            color: #999;
        }
        .label-preview .label-prices {
            text-align: center;
            margin-top: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .label-preview .label-prices .price-was {
            font-size: 14px;
            color: #999;
            text-decoration: line-through;
        }
        .label-preview .label-prices .price-now {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }
        .label-preview .label-prices .price-red {
            font-size: 22px;
            font-weight: 700;
            color: var(--red);
        }
        .label-preview .label-prices .price-discount {
            font-size: 13px;
            color: var(--success);
            font-weight: 600;
        }
        .label-preview .label-prices .price-save {
            font-size: 13px;
            color: var(--danger);
            font-weight: 600;
        }
        .label-preview .label-barcode {
            text-align: center;
            margin-top: 8px;
        }
        .label-preview .label-barcode svg {
            max-width: 180px;
        }
        .label-preview .label-footer {
            text-align: center;
            font-size: 9px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }
        .label-preview .label-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .label-preview .label-badge.red {
            background: var(--red);
            color: white;
        }
        .label-preview .label-badge.gold {
            background: var(--gold);
            color: white;
        }
        .label-preview .label-badge.green {
            background: var(--success);
            color: white;
        }
        .label-preview .label-badge.blue {
            background: var(--info);
            color: white;
        }

        /* ===== SHOP CARD ===== */
        .shop-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .shop-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .shop-card .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .shop-card .shop-header .shop-name {
            font-size: 16px;
            font-weight: 700;
        }
        .shop-card .shop-header .shop-status {
            font-size: 10px;
        }
        .shop-card .shop-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            font-size: 12px;
        }
        .shop-card .shop-details .label {
            color: var(--text-light);
        }
        .shop-card .shop-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .shop-card .shop-stats .stat {
            text-align: center;
        }
        .shop-card .shop-stats .stat .num {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }
        .shop-card .shop-stats .stat .lbl {
            font-size: 9px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        /* ===== COA TREE ===== */
        .coa-tree {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .coa-category {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
        }
        .coa-category h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }
        .coa-category ul {
            list-style: none;
            padding: 0;
        }
        .coa-category ul li {
            padding: 4px 0;
            font-size: 13px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .coa-category ul li .coa-balance {
            font-weight: 600;
            color: var(--gold);
        }

        /* ===== PRICE TAG STUDIO ===== */
        .tag-size-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .tag-size-btn {
            padding: 6px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card);
            cursor: pointer;
            transition: var(--transition);
            font-size: 12px;
            font-weight: 600;
        }
        .tag-size-btn:hover {
            border-color: var(--gold);
        }
        .tag-size-btn.active {
            border-color: var(--gold);
            background: var(--gold);
            color: white;
        }
        .tag-size-btn .size-label {
            display: block;
            font-size: 10px;
            font-weight: 400;
            color: var(--text-light);
        }
        .tag-size-btn.active .size-label {
            color: rgba(255, 255, 255, 0.8);
        }
        .price-tag-preview {
            background: white;
            padding: 20px;
            border-radius: var(--radius-sm);
            border: 1px solid #ddd;
            box-shadow: var(--shadow);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .price-tag-preview .tag-front {
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .price-tag-preview .tag-back {
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fafafa;
        }
        .price-tag-preview .tag-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .price-tag-preview .tag-logo span {
            color: var(--gold);
        }
        .price-tag-preview .tag-product-image {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }
        .price-tag-preview .tag-product-name {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin-top: 6px;
        }
        .price-tag-preview .tag-product-details {
            font-size: 11px;
            color: #666;
            text-align: center;
        }
        .price-tag-preview .tag-price-section {
            text-align: center;
            margin: 8px 0;
        }
        .price-tag-preview .tag-price-old {
            font-size: 14px;
            color: #999;
            text-decoration: line-through;
        }
        .price-tag-preview .tag-price-new {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
        }
        .price-tag-preview .tag-price-red {
            font-size: 28px;
            font-weight: 700;
            color: var(--red);
        }
        .price-tag-preview .tag-discount-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            background: var(--red);
            color: white;
        }
        .price-tag-preview .tag-barcode {
            text-align: center;
            margin-top: 6px;
        }
        .price-tag-preview .tag-barcode svg {
            max-width: 180px;
        }
        .price-tag-preview .tag-qr {
            text-align: center;
            margin-top: 6px;
        }
        .price-tag-preview .tag-qr svg {
            max-width: 80px;
        }
        .price-tag-preview .tag-footer {
            text-align: center;
            font-size: 9px;
            color: #999;
            margin-top: 8px;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        /* ===== REPORT GRID ===== */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .report-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .report-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--gold);
        }
        .report-card .report-icon {
            font-size: 28px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: var(--radius-sm);
        }
        .report-card .report-info {
            flex: 1;
        }
        .report-card .report-info .report-name {
            font-size: 13px;
            font-weight: 600;
        }
        .report-card .report-info .report-desc {
            font-size: 10px;
            color: var(--text-light);
        }
        .report-card .report-count {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold);
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) {
            .sidebar {
                left: 0 !important;
                width: var(--sidebar-width);
            }
            .main-content {
                margin-left: var(--sidebar-width);
            }
            .app-header .left .menu-btn {
                display: none;
            }
            .app-header .center {

        // ============================================================
        // SAVE DATA - ENHANCED WITH AUTO-SAVE
        // ============================================================
        function saveData(showIndicator = true) {
            try {
                const data = {
                    products, customers, suppliers, invoices, purchases, purchaseOrders,
                    productionOrders, shopTransfers, expenses, transactions, stockMovements,
                    staffMembers, userAccounts, members, galleries, priceHistory, backups,
                    notifications, settings, shopInventory, auditLogs, esewa, counters,
                    labelTemplates, printHistory, shops,
                    chartOfAccounts, journalEntries, payroll, taxRecords,
                    priceTagSettings,
                    lastSaved: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (showIndicator) {
                    updateAutoSaveIndicator('💾 Auto-Saved', 'saved');
                }
                return true;
            } catch (e) {
                console.warn('Save failed:', e);
                updateAutoSaveIndicator('⚠️ Save Failed', 'error');
                return false;
            }
        }

        function startAutoSave() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(() => {
                saveData(true);
            }, AUTO_SAVE_INTERVAL);
        }

        function startAutoBackup() {
            if (autoBackupTimer) clearInterval(autoBackupTimer);
            autoBackupTimer = setInterval(() => {
                createAutoBackup();
            }, AUTO_BACKUP_INTERVAL);
        }

        function createAutoBackup() {
            try {
                const data = {
                    products, customers, suppliers, invoices, purchases, purchaseOrders,
                    productionOrders, shopTransfers, expenses, transactions, stockMovements,
                    staffMembers, userAccounts, members, galleries, priceHistory,
                    notifications, settings, shopInventory, auditLogs, esewa, counters,
                    labelTemplates, printHistory, shops,
                    chartOfAccounts, journalEntries, payroll, taxRecords,
                    priceTagSettings,
                    backupDate: new Date().toISOString()
                };
                const json = JSON.stringify(data);
                const blob = new Blob([json], { type: 'application/json' });
                const size = (blob.size / 1024).toFixed(2) + ' KB';

                // Keep only last MAX_AUTO_BACKUPS backups
                if (backups.length >= MAX_AUTO_BACKUPS) {
                    backups.shift();
                }

                backups.push({
                    date: new Date().toISOString(),
                    size: size,
                    data: json,
                    type: 'auto',
                    createdAt: new Date().toISOString()
                });

                updateAutoSaveIndicator('📦 Auto-Backup Created', 'backup');
                addNotification('📦 Automatic backup created', 'success');
                saveData(false);
            } catch (e) {
                console.warn('Auto-backup failed:', e);
            }
        }

        function updateAutoSaveIndicator(msg, type = 'saved') {
            const el = document.getElementById('autoSaveIndicator');
            if (!el) return;
            el.textContent = msg;
            el.className = 'auto-save-indicator ' + type;
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => {
                el.className = 'auto-save-indicator';
                el.textContent = '💾 Auto-Saved';
            }, 3000);
        }

        // ============================================================
        // WRAPPER: Auto-save after every data change
        // ============================================================
        function autoSaveAfterAction() {
            saveData(true);
        }

        // Patch all data-modifying functions to auto-save
        const originalPush = Array.prototype.push;
        Array.prototype.push = function(...items) {
            const result = originalPush.apply(this, items);
            if (this === products || this === customers || this === suppliers ||
                this === invoices || this === purchases || this === expenses ||
                this === staffMembers || this === userAccounts || this === members ||
                this === shops || this === transactions) {
                autoSaveAfterAction();
            }
            return result;
        };

        // ============================================================
        // UPDATE NOTIFICATION BADGE
        // ============================================================
        function updateNotificationBadge() {
            const unread = notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifBadge');
            if (badge) { badge.textContent = unread;
                badge.style.display = unread > 0 ? 'block' : 'none'; }
        }

        function addNotification(msg, type = 'info') {
            notifications.unshift({ id: Date.now(), message: msg, type, time: 'Just now', read: false });
            updateNotificationBadge();
            saveData(false);
        }

        function showNotifications() {
            let html = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-size:14px;font-weight:600;">🔔 Notifications (${notifications.filter(n=>!n.read).length} unread)</span>
                    ${notifications.length > 0 ? `<button class="notif-clear-btn" onclick="clearAllNotifications()">🗑️ Clear All</button>` : ''}
                </div>
            `;

            if (notifications.length === 0) {
                html += '<p style="color:var(--text-light);text-align:center;padding:20px;">No notifications</p>';
            } else {
                html += notifications.map(n =>
                    `<div style="padding:8px 12px;border-bottom:1px solid var(--border);${n.read?'opacity:0.6;':''}">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span>${n.message}</span>
                            <div style="display:flex;gap:6px;align-items:center;">
                                <span style="font-size:10px;color:var(--text-light);">${n.time}</span>
                                ${!n.read?`<button class="btn btn-sm btn-secondary" onclick="markNotificationRead(${n.id})" style="font-size:9px;padding:2px 8px;">Read</button>`:''}
                            </div>
                        </div>
                    </div>`
                ).join('');
            }

            openModal('🔔 Notifications', html);
        }

        function clearAllNotifications() {
            notifications = [];
            updateNotificationBadge();
            saveData(false);
            showNotifications();
            showToast('🗑️ All notifications cleared', 'success');
        }

        function markNotificationRead(id) {
            const n = notifications.find(notif => notif.id === id);
            if (n) { n.read = true;
                updateNotificationBadge();
                saveData(false);
                showNotifications(); }
        }

        }

        // ============================================================
        // PERMISSION HELPERS
        // ============================================================
        function hasPermission(module, action) {
            if (!currentUser || !currentUser.permissions) return false;
            const modPerms = currentUser.permissions[module];
            if (!modPerms) return false;
            return modPerms[action] === true;
        }

        function canView(m) { return hasPermission(m, 'view'); }
        function canAdd(m) { return hasPermission(m, 'add'); }
        function canEdit(m) { return hasPermission(m, 'edit'); }
        function canDelete(m) { return hasPermission(m, 'delete'); }
        function canExport(m) { return hasPermission(m, 'export'); }
        function canPrint(m) { return hasPermission(m, 'print'); }
        function canDiscount(m) { return hasPermission(m, 'discount'); }
        function canManageUsers(m) { return hasPermission(m, 'manageUsers') || currentUser.role === 'Owner' || currentUser.role === 'Admin'; }
        function canApprove(m) { return hasPermission(m, 'approve') || currentUser.role === 'Owner' || currentUser.role === 'Admin' || currentUser.role === 'Manager'; }

        // ============================================================
        // ACCOUNTING ENGINE
        // ============================================================
        function postJournalEntry(date, description, reference, lines, shop = 'All') {
            const entry = {
                id: 'JE' + String(journalEntries.length + 1).padStart(6, '0'),
                date: date || new Date().toISOString().slice(0, 10),
                description: description,
                reference: reference,
                shop: shop,
                lines: lines,
                createdAt: new Date().toISOString()
            };
            journalEntries.push(entry);
            saveData(false);
            return entry;
        }

        function getAccountBalance(accountId, shop = null) {
            let balance = 0;
            const account = chartOfAccounts.find(a => a.id === accountId);
            if (!account) return 0;

            journalEntries.forEach(entry => {
                if (shop && entry.shop !== shop && entry.shop !== 'All') return;
                const line = entry.lines.find(l => l.accountId === accountId);
                if (line) {
                    if (account.normalBalance === 'Debit') {
                        balance += (line.debit || 0) - (line.credit || 0);
                    } else {
                        balance += (line.credit || 0) - (line.debit || 0);
                    }
                }
            });
            return balance;
        }

        function getTrialBalance(shop = null) {
            return chartOfAccounts.map(acc => {
                const balance = getAccountBalance(acc.id, shop);
                return {
                    account: acc,
                    debit: balance > 0 && acc.normalBalance === 'Debit' ? balance : 0,
                    credit: balance > 0 && acc.normalBalance === 'Credit' ? balance : 0
                };
            });
        }

        function getProfitAndLoss(period = 'month', shop = null) {
            const today = new Date().toISOString().slice(0, 10);
            const month = today.slice(0, 7);
            const year = today.slice(0, 4);

            let filteredEntries = journalEntries;
            if (shop) filteredEntries = filteredEntries.filter(e => e.shop === shop || e.shop === 'All');

            if (period === 'today') {
                filteredEntries = filteredEntries.filter(e => e.date === today);
            } else if (period === 'month') {
                filteredEntries = filteredEntries.filter(e => e.date.startsWith(month));
            } else if (period === 'year') {
                filteredEntries = filteredEntries.filter(e => e.date.startsWith(year));
            }

            let revenue = 0,
                cogs = 0,
                expenses = 0;

            filteredEntries.forEach(entry => {
                entry.lines.forEach(line => {
                    const acc = chartOfAccounts.find(a => a.id === line.accountId);
                    if (!acc) return;
                    const amount = (line.credit || 0) - (line.debit || 0);
                    if (acc.type === 'Income') revenue += amount;
                    else if (acc.type === 'Expense') {
                        if (acc.name === 'Inventory') cogs += Math.abs(amount);
                        else expenses += Math.abs(amount);
                    }
                });
            });

            const grossProfit = revenue - cogs;
            const netProfit = grossProfit - expenses;
            return { revenue, cogs, expenses, grossProfit, netProfit };
        }

        function getBalanceSheet(shop = null) {
            let assets = 0,
                liabilities = 0,
                equity = 0;
            const trial = getTrialBalance(shop);

            trial.forEach(item => {
                const acc = item.account;
                const balance = acc.normalBalance === 'Debit' ? item.debit : item.credit;
                if (acc.type === 'Asset') assets += balance;
                else if (acc.type === 'Liability') liabilities += balance;
            });

            const pnl = getProfitAndLoss('all', shop);
            equity = pnl.netProfit;

            return { assets, liabilities, equity };
        }

        function integrateSale(invoice) {
            const lines = [];
            if (invoice.paymentMethod === 'Cash' || invoice.paymentMethod === 'eSewa' || invoice.paymentMethod === 'Bank Transfer') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash' || a.name === 'Bank');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: invoice.grandTotal, credit: 0 });
            } else {
                const recAcc = chartOfAccounts.find(a => a.name === 'Customer Receivable');
                if (!recAcc) {
                    const newAcc = { id: 'A7', code: '1070', name: 'Customer Receivable', type: 'Asset',
                        normalBalance: 'Debit' };
                    chartOfAccounts.push(newAcc);
                    lines.push({ accountId: newAcc.id, debit: invoice.grandTotal, credit: 0 });
                } else {
                    lines.push({ accountId: recAcc.id, debit: invoice.grandTotal, credit: 0 });
                }
            }
            const revAcc = chartOfAccounts.find(a => a.name === 'Product Sales');
            if (revAcc) lines.push({ accountId: revAcc.id, debit: 0, credit: invoice.grandTotal });
            if (invoice.tax > 0) {
                const taxAcc = chartOfAccounts.find(a => a.name === 'Tax Payable');
                if (taxAcc) lines.push({ accountId: taxAcc.id, debit: 0, credit: invoice.tax });
            }
            postJournalEntry(invoice.date, `Sale: ${invoice.invoiceNumber}`, invoice.id, lines, invoice.shop);
        }

        function integratePurchase(purchase) {
            const lines = [];
            const invAcc = chartOfAccounts.find(a => a.name === 'Inventory');
            if (invAcc) lines.push({ accountId: invAcc.id, debit: purchase.totalAmount, credit: 0 });

            if (purchase.paymentMethod === 'Cash' || purchase.paymentMethod === 'Bank Transfer') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash' || a.name === 'Bank');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: purchase.totalAmount });
            } else {
                const payAcc = chartOfAccounts.find(a => a.name === 'Supplier Payable');
                if (payAcc) lines.push({ accountId: payAcc.id, debit: 0, credit: purchase.totalAmount });
            }
            postJournalEntry(purchase.date, `Purchase: ${purchase.poNumber}`, purchase.id, lines, purchase.shop);
        }

        function integrateExpense(expense) {
            const lines = [];
            const expAcc = chartOfAccounts.find(a => a.name === expense.category);
            if (!expAcc) {
                const newAcc = { id: 'E' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1),
                    code: '5' + String(chartOfAccounts.filter(a => a.type === 'Expense').length + 1).padStart(3, '0'),
                    name: expense.category, type: 'Expense', normalBalance: 'Debit' };
                chartOfAccounts.push(newAcc);
                lines.push({ accountId: newAcc.id, debit: expense.amount, credit: 0 });
            } else {
                lines.push({ accountId: expAcc.id, debit: expense.amount, credit: 0 });
            }

            if (expense.paymentMethod === 'Cash') {
                const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
                if (cashAcc) lines.push({ accountId: cashAcc.id, debit: 0, credit: expense.amount });
            } else {
                const bankAcc = chartOfAccounts.find(a => a.name === 'Bank');
                if (bankAcc) lines.push({ accountId: bankAcc.id, debit: 0, credit: expense.amount });
            }
            postJournalEntry(expense.date, `Expense: ${expense.category}`, expense.id, lines);
        }

        function performSearch() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const results = document.getElementById('searchResults');
            if (!query) { results.innerHTML = '<p style="color:var(--text-light);">Enter a search term</p>'; return; }

            let items = [];

            products.filter(p => p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (p.barcode && p.barcode.includes(query))).forEach(p => {
                const shopStock = shopInventory[p.id] || {};
                const stockInfo = Object.entries(shopStock).map(([shop, qty]) => `${shop}: ${qty}`).join(', ');
                const img = (p.images && p.images.length) ? p.images[0] :
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2230%22 height=%2230%22%3E%3Crect width=%2230%22 height=%2230%22 fill=%22%23ddd%22/%3E%3Ctext x=%2215%22 y=%2215%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                items.push({ type: '📦 Product', name: p.name,
                    detail: `${CURRENCY} ${p.sellingPrice} | Stock: ${p.stock} | ${stockInfo}`, link: 'products',
                    id: p.id, img: img });
            });

            customers.filter(c => c.fullName.toLowerCase().includes(query) || c.mobile.includes(query)).forEach(c => {
                items.push({ type: '👤 Customer', name: c.fullName,
                    detail: `${c.mobile} | ${c.membershipLevel||'None'}`, link: 'customers', id: c.id });
            });

            invoices.filter(inv => inv.invoiceNumber.toLowerCase().includes(query) || inv.customerName.toLowerCase().includes(query)).forEach(inv => {
                items.push({ type: '🧾 Invoice', name: inv.invoiceNumber,
                    detail: `${CURRENCY} ${inv.grandTotal} | ${inv.customerName} | ${inv.shop||'-'}`, link: 'invoices',
                    id: inv.id });
            });

            shops.filter(s => s.shopName.toLowerCase().includes(query) || s.shopCode.toLowerCase().includes(query) || s.city.toLowerCase().includes(query)).forEach(s => {
                items.push({ type: '🏪 Shop', name: s.shopName,
                    detail: `${s.shopCode} | ${s.city} | ${s.branchType}`, link: 'shops', id: s.id });

            suppliers.filter(s => s.supplierName.toLowerCase().includes(query) || s.phone.includes(query)).forEach(s => {
                items.push({ type: '🏭 Supplier', name: s.supplierName,
                    detail: `${s.phone} | ${s.company||'N/A'}`, link: 'suppliers', id: s.id });
            });

            staffMembers.filter(s => s.name.toLowerCase().includes(query) || s.employeeId.toLowerCase().includes(query) || s.username.toLowerCase().includes(query) || s.mobile.includes(query)).forEach(s => {
                items.push({ type: '👤 Staff', name: s.name,

            });

            if (!items.length) {
                results.innerHTML = '<p style="color:var(--text-light);">No results found.</p>';
                return;
            }

            let html = `<div class="table-wrapper"><table><thead><tr><th>Image</th><th>Type</th><th>Name</th><th>Details</th><th>Action</th></tr></thead><tbody>`;
            items.slice(0, 30).forEach(item => {

                html += `

                results.innerHTML = `<div class="result-item" onclick="posCreateCustomer('${query}')">➕ Create new: ${query}</div>`;

        function posSelectCustomer(id) {

            document.getElementById('posCustomerPhone').value = c.mobile;
            document.getElementById('posMembership').value = c.membershipLevel || 'None';

        }

        function posCreateCustomer(name) {
            const c = {
                id: 'C' + String(counters.customer++).padStart(3, '0'),
                fullName: name,
                mobile: '',
                email: '',
                address: '',
                membershipLevel: 'Regular',
                loyaltyPoints: 0,
                creditLimit: 0,

            };
