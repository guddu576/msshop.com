        function posSearchProduct() {
            const query = document.getElementById('posProductSearch').value.trim().toLowerCase();
            const results = document.getElementById('posProductResults');
            if (!query) { results.innerHTML = ''; return; }
            const matches = products.filter(p =>
                p.name.toLowerCase().includes(query) || (p.sku && p.sku.toLowerCase().includes(query)) || (p.barcode && p.barcode.includes(query))
            );
            if (!matches.length) { results.innerHTML = '<div class="result-item">No products found</div>'; return; }
            results.innerHTML = matches.slice(0, 8).map(p => {
                const img = (p.images && p.images.length) ? p.images[0] :
                    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                return `
                    <div class="result-item" onclick="posAddProduct('${p.id}')">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <img src="${img}" style="width:35px;height:35px;object-fit:cover;border-radius:4px;" class="product-thumb" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'">
                            <div><div style="font-weight:600;font-size:13px;">${p.name}</div>
                            <div style="font-size:11px;color:var(--text-light);">${p.sku||''} | Stock: ${p.stock}</div></div>
                        </div>
                        <div style="font-weight:700;color:var(--gold);">${CURRENCY} ${p.sellingPrice}</div>
                    </div>
                `;
            }).join('');
        }

        function posQuickAdd(id) { posAddProduct(id); }

        function posAddProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (!p) { showToast('Product not found', 'error'); return; }
            const qty = parseInt(document.getElementById('posQty').value) || 1;
            if (qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
            const existing = posCart.find(item => item.id === p.id);
            if (existing) {
                if (existing.qty + qty > p.stock) { showToast(`Insufficient stock! Available: ${p.stock}`, 'error'); return; }
                existing.qty += qty;
                existing.lineTotal = existing.qty * existing.price;
            } else {
                posCart.push({
                    id: p.id,
                    name: p.name,
                    sku: p.sku || '',
                    image: (p.images && p.images.length) ? p.images[0] : null,
                    price: p.sellingPrice,
                    qty: qty,
                    lineTotal: qty * p.sellingPrice,
                    stock: p.stock
                });
            }
            document.getElementById('posProductSearch').value = '';
            document.getElementById('posProductResults').innerHTML = '';
            document.getElementById('posPrice').value = p.sellingPrice;
            posUpdateCart();
            showToast(`✅ ${p.name} added`, 'success');
        }

        function posRemoveFromCart(idx) { posCart.splice(idx, 1); posUpdateCart(); }

        function posClearCart() { if (posCart.length && confirm('Clear cart?')) { posCart = []; posUpdateCart(); } }

        function posCancelSale() { if (posCart.length && confirm('Cancel this sale?')) { posCart = []; posUpdateCart(); showToast('❌ Sale cancelled', 'warning'); } }

        function posUpdateCart() {
            const container = document.getElementById('posCart');
            const count = document.getElementById('cartCount');
            if (!container) return;
            if (count) count.textContent = posCart.length;
            if (!posCart.length) {
                container.innerHTML = '<p style="color:var(--text-light);padding:10px;text-align:center;">Cart empty</p>';
                posCalcTotals();
                return;
            }
            let html = `<div class="table-wrapper"><table><thead><tr><th>Image</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>`;
            posCart.forEach((item, idx) => {
                const img = item.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E';
                html += `
                    <tr>
                        <td><div class="product-thumb" style="width:35px;height:35px;border-radius:4px;overflow:hidden;"><img src="${img}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2235%22 height=%2235%22%3E%3Crect width=%2235%22 height=%2235%22 fill=%22%23ddd%22/%3E%3Ctext x=%2217%22 y=%2217%22 font-size=%2218%22 text-anchor=%22middle%22 dy=%22.3em%22%3E📦%3C/text%3E%3C/svg%3E'"></div></td>
                        <td><strong>${item.name}</strong><br><span style="font-size:10px;color:var(--text-light);">${item.sku||''}</span></td>
                        <td><button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, -1)">-</button> ${item.qty} <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${idx}, 1)">+</button></td>
                        <td>${CURRENCY} ${item.price}</td>
                        <td>${CURRENCY} ${item.lineTotal.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${idx})">✕</button></td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
            posCalcTotals();
        }

        function posChangeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty < 1) return;
            const prod = products.find(p => p.id === item.id);
            if (prod && newQty > prod.stock) { showToast(`Insufficient stock! Available: ${prod.stock}`, 'error'); return; }
            item.qty = newQty;
            item.lineTotal = item.qty * item.price;
            posUpdateCart();
        }

        function posCalcTotals() {
            const subtotal = posCart.reduce((s, i) => s + i.lineTotal, 0);
            const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
            const taxRate = settings.taxRate || VAT_RATE;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const grandTotal = afterDiscount + tax;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const change = Math.max(0, paid - grandTotal);
            document.getElementById('posSubtotal').value = subtotal.toFixed(2);
            document.getElementById('posTax').value = tax.toFixed(2);
            document.getElementById('posGrandTotal').value = grandTotal.toFixed(2);
            document.getElementById('posChange').value = change.toFixed(2);
            document.getElementById('posStatus').value = (paid >= grandTotal) ? 'Paid' : 'Due';
            document.getElementById('posPoints').value = Math.floor(grandTotal / 100);
        }

        function posCompleteSale() {
            if (!posCart.length) { showToast('Cart is empty', 'error'); return; }
            const customerName = document.getElementById('posCustomer').value || 'Walk-in Customer';
            const shop = document.getElementById('posShop').value || 'Thamel Shop';
            const paymentMethod = document.getElementById('posPayment').value;
            const grandTotal = parseFloat(document.getElementById('posGrandTotal').value) || 0;
            const paid = parseFloat(document.getElementById('posPaid').value) || 0;
            const status = paid >= grandTotal ? 'Paid' : 'Partial';
            const inv = {
                id: 'INV' + String(counters.invoice++).padStart(6, '0'),
                invoiceNumber: document.getElementById('posInvNumber').value,
                date: document.getElementById('posInvDate').value || new Date().toISOString().slice(0, 10),
                customerName: customerName,
                shop: shop,
                items: posCart.map(item => ({ ...item })),
                subtotal: parseFloat(document.getElementById('posSubtotal').value) || 0,
                discount: parseFloat(document.getElementById('posDiscount').value) || 0,
                tax: parseFloat(document.getElementById('posTax').value) || 0,
                grandTotal: grandTotal,
                paidAmount: paid,
                balanceDue: Math.max(0, grandTotal - paid),
                paymentMethod: paymentMethod,
                paymentStatus: status,
                status: 'Completed',
                createdAt: new Date().toISOString()
            };
            invoices.push(inv);
            posCart.forEach(item => {
                const prod = products.find(p => p.id === item.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - item.qty);
                    prod.salesCount = (prod.salesCount || 0) + item.qty;
                    if (shopInventory[prod.id]) {
                        shopInventory[prod.id][shop] = Math.max(0, (shopInventory[prod.id][shop] || 0) - item.qty);
                    }
                }
            });
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: 'Income',
                amount: grandTotal,
                description: `Invoice ${inv.invoiceNumber} - ${customerName}`,
                date: inv.date,
                reference: inv.id,
                paymentMethod: paymentMethod,
                createdAt: new Date().toISOString()
            });
            if (paymentMethod === 'eSewa') {
                esewa.balance = (esewa.balance || 0) + grandTotal;
            }
            const cust = customers.find(c => c.fullName === customerName);
            if (cust) {
                cust.totalPurchases = (cust.totalPurchases || 0) + grandTotal;
                cust.dueBalance = (cust.dueBalance || 0) + inv.balanceDue;
                const points = Math.floor(grandTotal / 100);
                cust.loyaltyPoints = (cust.loyaltyPoints || 0) + points;
            }
            settings.nextInvoiceNumber = (settings.nextInvoiceNumber || 1001) + 1;
            integrateSale(inv);
            logAudit('SALE', `Invoice ${inv.invoiceNumber} created for ${customerName} - ${CURRENCY} ${grandTotal}`);
            addNotification(`🧾 Invoice ${inv.invoiceNumber} created for ${customerName}`, 'success');
            posCart = [];
            posUpdateCart();
            showToast(`✅ Invoice ${inv.invoiceNumber} completed!`, 'success');
            renderInvoices();
            saveData(true);
        }

        function generatePriceTagHTML(product, size = 'A6') {
            const sizeMap = {

            const margin = product.costPrice > 0 ? (profit / product.costPrice * 100).toFixed(1) : 0;

            return `

                            </div>

        function calcPriceDetails() {
            const cost = parseFloat(document.getElementById('prodCost')?.value) || 0;
            const sell = parseFloat(document.getElementById('prodSell')?.value) || 0;
            const mrp = parseFloat(document.getElementById('prodMrp')?.value) || 0;
            const purchase = parseFloat(document.getElementById('prodPurchasePrice')?.value) || 0;
            const transport = parseFloat(document.getElementById('prodTransportCost')?.value) || 0;
            const other = parseFloat(document.getElementById('prodOtherExpenses')?.value) || 0;

            const landed = purchase + transport + other;
            const landedEl = document.getElementById('prodLandedCost');
            if (landedEl) landedEl.value = landed.toFixed(2);

            const profit = sell - cost;
            const margin = cost > 0 ? (profit / cost * 100) : 0;
            const discount = mrp > 0 ? ((1 - sell / mrp) * 100) : 0;

            const profitEl = document.getElementById('calcProfit');
            const marginEl = document.getElementById('calcMargin');
            const discountEl = document.getElementById('calcDiscount');
            if (profitEl) profitEl.textContent = `${CURRENCY} ${profit.toFixed(2)}`;
            if (marginEl) marginEl.textContent = `${margin.toFixed(1)}%`;
            if (discountEl) discountEl.textContent = `${discount.toFixed(1)}%`;
        }

        function previewProductFiles() {
            const input = document.getElementById('prodImageFiles');
            const preview = document.getElementById('prodImagePreview');
            if (!input.files) return;
            for (let file of input.files) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.createElement('div');
                    img.className = 'image-preview-item';
                    img.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;"><button class="remove-img" onclick="this.parentElement.remove()">✕</button>`;
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        }

        function removeProductImage(idx) {
            const preview = document.getElementById('prodImagePreview');
            if (preview && preview.children[idx]) preview.children[idx].remove();
        }

        function saveProduct(id) {
            const textarea = document.getElementById('prodImages');
            const preview = document.getElementById('prodImagePreview');
            let images = textarea.value.split('\n').map(s => s.trim()).filter(s => s);
            if (preview) {
                const imgEls = preview.querySelectorAll('.image-preview-item img');
                imgEls.forEach(img => {
                    if (img.src && img.src.startsWith('data:image')) {
                        images.push(img.src);
                    }
                });
            }

            const cost = parseFloat(document.getElementById('prodCost').value) || 0;
            const sell = parseFloat(document.getElementById('prodSell').value) || 0;

            const data = {
                id: id || 'P' + String(counters.product++).padStart(3, '0'),
                name: document.getElementById('prodName').value.trim(),
                sku: document.getElementById('prodSku').value.trim(),
                barcode: document.getElementById('prodBarcode').value.trim(),
                category: document.getElementById('prodCategory').value,
                brand: document.getElementById('prodBrand').value,
                color: document.getElementById('prodColor').value.trim(),
                size: document.getElementById('prodSize').value.trim(),
                material: document.getElementById('prodMaterial').value.trim(),
                costPrice: cost,
                sellingPrice: sell,
                wholesalePrice: parseFloat(document.getElementById('prodWholesale').value) || 0,
                mrpPrice: parseFloat(document.getElementById('prodMrp').value) || 0,
                minPrice: 0,
                maxPrice: 0,
                description: document.getElementById('prodDesc').value.trim(),
                features: document.getElementById('prodFeatures').value.trim(),
                images: images.slice(0, 10),
                status: document.getElementById('prodStatus').value,
                stock: parseInt(document.getElementById('prodStock').value) || 0,
                minStock: parseInt(document.getElementById('prodMinStock').value) || 5,
                maxStock: parseInt(document.getElementById('prodMaxStock').value) || 100,
                warehouse: document.getElementById('prodWarehouse').value,
                salesCount: 0,
                bestFor: document.getElementById('prodBestFor').value.trim(),
                warranty: document.getElementById('prodWarranty').value.trim(),
                origin: document.getElementById('prodOrigin').value.trim(),
                manufacturer: document.getElementById('prodManufacturer').value.trim(),
                supplier: document.getElementById('prodSupplier').value.trim(),
                countryOfOrigin: document.getElementById('prodOrigin').value.trim(),
                purchasePrice: parseFloat(document.getElementById('prodPurchasePrice').value) || 0,
                supplierCost: parseFloat(document.getElementById('prodSupplierCost').value) || 0,
                factoryPrice: parseFloat(document.getElementById('prodFactoryPrice').value) || 0,
                importPrice: parseFloat(document.getElementById('prodImportPrice').value) || 0,
                transportCost: parseFloat(document.getElementById('prodTransportCost').value) || 0,
                otherExpenses: parseFloat(document.getElementById('prodOtherExpenses').value) || 0,
                landedCost: parseFloat(document.getElementById('prodLandedCost').value) || 0,
                retailPrice: parseFloat(document.getElementById('prodRetailPrice').value) || 0,
                dealerPrice: parseFloat(document.getElementById('prodDealerPrice').value) || 0,
                onlinePrice: parseFloat(document.getElementById('prodOnlinePrice').value) || 0,
                memberPrice: parseFloat(document.getElementById('prodMemberPrice').value) || 0,
                festivalOfferPrice: parseFloat(document.getElementById('prodFestivalPrice').value) || 0,
                createdAt: new Date().toISOString()
            };
            if (!data.name) { showToast('Product name is required', 'error'); return; }
            if (id) {
                const idx = products.findIndex(p => p.id === id);
                if (idx >= 0) { products[idx] = { ...products[idx], ...data }; }
            } else {
                products.push(data);
            }
            if (!shopInventory[data.id]) shopInventory[data.id] = {};
            shops.forEach(shop => {
                shopInventory[data.id][shop.shopName] = (shop.shopName === data.warehouse) ? data.stock : 0;
            });

            const priceEntry = {
                productId: data.id,
                productName: data.name,
                oldPrice: id ? products.find(p => p.id === id)?.sellingPrice || 0 : 0,
                newPrice: data.sellingPrice,
                date: new Date().toISOString(),
                user: currentUser.name
            };
            priceHistory.push(priceEntry);

            closeModal();
            showToast(`✅ Product ${data.name} saved`, 'success');
            logAudit('PRODUCT', `${id?'Updated':'Added'} product ${data.name}`);
            renderProducts();
            saveData(true);
        }

        function editProduct(id) {
            const p = products.find(pr => pr.id === id);
            if (p) openProductModal(p);
        }

        function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const p = products.find(pr => pr.id === id);
            products = products.filter(pr => pr.id !== id);
            delete shopInventory[id];
            showToast(`🗑️ Product ${p?.name||''} deleted`, 'warning');
            logAudit('DELETE_PRODUCT', `Deleted product ${p?.name||id}`);
            renderProducts();
            saveData(true);
        }

        function importProducts() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls,.csv';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const wb = XLSX.read(ev.target.result, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws);
                        data.forEach(row => {
                            if (row.Name) {
                                const p = {
                                    id: 'P' + String(counters.product++).padStart(3, '0'),
                                    name: row.Name || '',
                                    sku: row.SKU || '',
                                    barcode: row.Barcode || '',
                                    category: row.Category || '',
                                    brand: row.Brand || '',
                                    costPrice: parseFloat(row.Cost) || 0,
                                    sellingPrice: parseFloat(row.Selling) || 0,
                                    wholesalePrice: parseFloat(row.Wholesale) || 0,
                                    mrpPrice: parseFloat(row.MRP) || 0,
                                    stock: parseInt(row.Stock) || 0,
                                    minStock: parseInt(row['Min Stock']) || 5,
                                    maxStock: 100,
                                    status: row.Status || 'Active',
                                    warehouse: row.Warehouse || 'Thamel Shop',
                                    images: row.Images ? row.Images.split(',').map(s => s.trim()) : [],
                                    salesCount: 0,
                                    purchasePrice: parseFloat(row['Purchase Price']) || 0,
                                    supplierCost: parseFloat(row['Supplier Cost']) || 0,
                                    factoryPrice: parseFloat(row['Factory Price']) || 0,
                                    importPrice: parseFloat(row['Import Price']) || 0,
                                    transportCost: parseFloat(row['Transport Cost']) || 0,
                                    otherExpenses: parseFloat(row['Other Expenses']) || 0,
                                    landedCost: parseFloat(row['Landed Cost']) || 0,
                                    retailPrice: parseFloat(row['Retail Price']) || 0,
                                    dealerPrice: parseFloat(row['Dealer Price']) || 0,
                                    onlinePrice: parseFloat(row['Online Price']) || 0,
                                    memberPrice: parseFloat(row['Member Price']) || 0,
                                    festivalOfferPrice: parseFloat(row['Festival Offer']) || 0,
                                    createdAt: new Date().toISOString()
                                };
                                products.push(p);
                            }
                        });
                        showToast(`✅ ${data.length} products imported`, 'success');
                        renderProducts();
                        saveData(true);
                    } catch (err) { showToast('Import failed: ' + err.message, 'error'); }
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }

        function applyBulkPrice() {
            const category = document.getElementById('bulkCategory').value;
            const priceType = document.getElementById('bulkPriceType').value;
            const operation = document.getElementById('bulkOperation').value;
            const value = parseFloat(document.getElementById('bulkValue').value) || 0;
            const schedule = document.getElementById('bulkSchedule').value;

            let updated = 0;
            products.forEach(p => {
                if (category !== 'all' && p.category !== category) return;
                const oldVal = p[priceType] || 0;
                let newVal = oldVal;
                if (operation === 'increase') newVal = oldVal * (1 + value / 100);
                else if (operation === 'decrease') newVal = oldVal * (1 - value / 100);
                else if (operation === 'set') newVal = value;
                p[priceType] = Math.round(newVal);
                updated++;
            });
            showToast(`✅ ${updated} products updated${schedule ? ' (scheduled for '+schedule+')' : ''}`, 'success');
            logAudit('BULK_PRICE', `Bulk ${operation} ${priceType} by ${value}% for ${updated} products`);
            closeModal();
            renderPricing();
            saveData(true);
        }

        function savePurchase() {
            const supplierId = document.getElementById('purchaseSupplier').value;
            const supplier = suppliers.find(s => s.id === supplierId);
            const supplierName = supplier ? supplier.supplierName : 'Unknown Supplier';
            const date = document.getElementById('purchaseDate').value || new Date().toISOString().slice(0, 10);
            const shop = document.getElementById('purchaseShop').value;
            const productName = document.getElementById('purchaseProduct').value.trim();
            const qty = parseInt(document.getElementById('purchaseQty').value) || 1;
            const cost = parseFloat(document.getElementById('purchaseCost').value) || 0;
            const payment = document.getElementById('purchasePayment').value;
            const status = document.getElementById('purchaseStatus').value;
            const notes = document.getElementById('purchaseNotes').value.trim();
            if (!productName) { showToast('Product name is required', 'error'); return; }
            const total = qty * cost;
            const po = {
                id: 'PO' + String(purchaseOrders.length + 1).padStart(6, '0'),
                poNumber: 'PO-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(purchaseOrders.length + 1).padStart(4, '0'),
                supplier: supplierId,
                supplierName: supplierName,
                date: date,
                shop: shop,
                items: [{ product: productName, qty, cost, total }],
                totalAmount: total,
                paymentMethod: payment,
                status: status,
                notes: notes,
                createdAt: new Date().toISOString()
            };
            purchaseOrders.push(po);
            purchases.push({ ...po, id: po.id });
            if (supplier) {
                supplier.totalPurchase = (supplier.totalPurchase || 0) + total;
                if (payment === 'Credit') supplier.dueAmount = (supplier.dueAmount || 0) + total;
            }
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: 'Expense',
                amount: total,
                description: `Purchase ${po.poNumber} - ${supplierName}`,
                date: date,
                reference: po.id,
                paymentMethod: payment,
                createdAt: new Date().toISOString()
            });
            integratePurchase(po);
            closeModal();
            showToast(`📥 Purchase ${po.poNumber} saved`, 'success');
            logAudit('PURCHASE', `Purchase ${po.poNumber} from ${supplierName} for ${CURRENCY} ${total}`);
            renderPurchases();
            saveData(true);
        }

        function saveTransfer() {
            const prodId = document.getElementById('transferProduct').value;
            const qty = parseInt(document.getElementById('transferQty').value) || 1;
            const from = document.getElementById('transferFrom').value;
            const to = document.getElementById('transferTo').value;
            const date = document.getElementById('transferDate').value || new Date().toISOString().slice(0, 10);
            const status = document.getElementById('transferStatus').value;
            if (from === to) { showToast('From and To shops must be different', 'error'); return; }
            const product = products.find(p => p.id === prodId);
            if (!product) { showToast('Select a product', 'error'); return; }
            const fromStock = shopInventory[prodId]?.[from] || 0;
            if (fromStock < qty) { showToast(`Insufficient stock in ${from}. Available: ${fromStock}`, 'error'); return; }
            const transfer = {
                id: 'TRF' + String(shopTransfers.length + 1).padStart(6, '0'),
                transferNumber: 'TRF-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(shopTransfers.length + 1).padStart(4, '0'),
                productId: prodId,
                productName: product.name,
                qty: qty,
                fromShop: from,
                toShop: to,
                status: status,
                date: date,
                createdAt: new Date().toISOString()
            };
            shopTransfers.push(transfer);
            if (!shopInventory[prodId]) shopInventory[prodId] = {};
            shopInventory[prodId][from] = Math.max(0, (shopInventory[prodId][from] || 0) - qty);
            shopInventory[prodId][to] = (shopInventory[prodId][to] || 0) + qty;
            if (from === product.warehouse) {
                product.stock = Math.max(0, product.stock - qty);
            }
            closeModal();
            showToast(`🚚 Transfer from ${from} to ${to} created`, 'success');
            logAudit('TRANSFER', `Stock transfer ${transfer.transferNumber} from ${from} to ${to} (${product.name} x${qty})`);
            renderTransfers();
            saveData(true);
        }

        function saveEsewa() {
            const type = document.getElementById('esewaType').value;
            const amount = parseFloat(document.getElementById('esewaAmount').value) || 0;
            const desc = document.getElementById('esewaDesc').value.trim() || 'eSewa transaction';
            if (amount <= 0) { showToast('Amount is required', 'error'); return; }
            if (type === 'withdraw' && amount > esewa.balance) { showToast('Insufficient eSewa balance', 'error'); return; }
            esewa.balance += (type === 'deposit' ? amount : -amount);
            transactions.push({
                id: 'TXN' + String(transactions.length + 1).padStart(6, '0'),
                type: type === 'deposit' ? 'Income' : 'Expense',
                amount: amount,
                description: `eSewa ${type}: ${desc}`,
                date: new Date().toISOString().slice(0, 10),
                paymentMethod: 'eSewa',
                createdAt: new Date().toISOString()
            });
            closeModal();
            showToast(`📱 eSewa ${type} of ${CURRENCY} ${amount} completed`, 'success');
            logAudit('ESEWA', `eSewa ${type} ${CURRENCY} ${amount} - ${desc}`);
            renderFinance();
            saveData(true);
        }

        function saveStaff(id) {
            const data = {
                id: id || 'STF' + String(staffMembers.length + 1).padStart(3, '0'),
                employeeId: document.getElementById('staffEmpId').value.trim() || 'EMP-' + String(staffMembers.length + 1).padStart(4, '0'),
                name: document.getElementById('staffName').value.trim(),
                position: document.getElementById('staffPosition').value.trim(),
                department: document.getElementById('staffDept').value.trim(),
                mobile: document.getElementById('staffMobile').value.trim(),
                email: document.getElementById('staffEmail').value.trim(),
                salary: parseFloat(document.getElementById('staffSalary').value) || 0,
                joiningDate: document.getElementById('staffJoin').value || new Date().toISOString().slice(0, 10),
                status: document.getElementById('staffStatus').value,
                role: document.getElementById('staffRole').value,
                shift: document.getElementById('staffShift').value,
                username: document.getElementById('staffUsername').value.trim(),
                password: document.getElementById('staffPassword').value.trim() || 'staff123',
                assignedShops: Array.from(document.getElementById('staffShops').selectedOptions).map(o => o.value),
                userAccount: '',
                createdAt: new Date().toISOString()
            };
            if (!data.name) { showToast('Staff name is required', 'error'); return; }

            const existingUser = userAccounts.find(u => u.username === data.username && u.staffId !== data.id);
            if (existingUser) {
                showToast('⚠️ Username already exists. Please choose another.', 'error');
                return;
            }

            if (id) {
                const idx = staffMembers.findIndex(s => s.id === id);
                if (idx >= 0) {
                    if (!document.getElementById('staffPassword').value.trim()) {
                        data.password = staffMembers[idx].password;
                    }
                    staffMembers[idx] = { ...staffMembers[idx], ...data };
                }
                const userIdx = userAccounts.findIndex(u => u.staffId === id);
                if (userIdx >= 0) {
                    userAccounts[userIdx].username = data.username;
                    userAccounts[userIdx].fullName = data.name;
                    userAccounts[userIdx].role = data.role;
                    userAccounts[userIdx].email = data.email;
                    userAccounts[userIdx].status = data.status;
                    userAccounts[userIdx].assignedShops = data.assignedShops;
                    if (data.password && data.password !== staffMembers.find(s => s.id === id)?.password) {
                        userAccounts[userIdx].password = data.password;
                    }
                }
                closeModal();
                showToast(`✅ Staff ${data.name} updated`, 'success');
                logAudit('STAFF', `Updated staff ${data.name}`);
            } else {
                staffMembers.push(data);
                const user = {
                    id: 'USR' + String(userAccounts.length + 1).padStart(3, '0'),
                    username: data.username || data.name.toLowerCase().replace(/\s/g, ''),
                    fullName: data.name,
                    role: data.role,
                    email: data.email,
                    password: data.password || 'staff123',
                    status: data.status,
                    staffId: data.id,
                    permissions: 'edit',
                    assignedShops: data.assignedShops,
                    createdAt: new Date().toISOString()
                };
                userAccounts.push(user);
                data.userAccount = user.id;
                closeModal();
                showToast(`👤 Staff ${data.name} added`, 'success');
                logAudit('STAFF', `Added staff ${data.name}`);
            }
            renderStaff();
            saveData(true);
        }

        function createBackup() {
            const data = {
                products, customers, suppliers, invoices, purchases, purchaseOrders,
                productionOrders, shopTransfers, expenses, transactions, stockMovements,
                staffMembers, userAccounts, members, galleries, priceHistory,
                notifications, settings, shopInventory, auditLogs, esewa, counters,
                labelTemplates, printHistory, shops,
                chartOfAccounts, journalEntries, payroll, taxRecords,
                priceTagSettings,
                backupDate: new Date().toISOString()
            };
            const json = JSON.stringify(data);
            const blob = new Blob([json], { type: 'application/json' });
            const size = (blob.size / 1024).toFixed(2) + ' KB';
            backups.push({ date: new Date().toISOString(), size, data: json, createdAt: new Date().toISOString() });
            showToast('💾 Backup created successfully', 'success');
            logAudit('BACKUP', 'Created backup');
            renderBackup();
            saveData(true);
        }

        function restoreBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.products) { showToast('Invalid backup file', 'error'); return; }
                        if (!confirm('Restore will overwrite all current data. Continue?')) return;
                        Object.assign(window, data);
                        showToast('📂 Backup restored successfully', 'success');
                        logAudit('RESTORE', 'Restored from backup');
                        navigateTo('dashboard');
                        saveData(true);
                    } catch (err) { showToast('Restore failed: ' + err.message, 'error'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function downloadBackup(idx) {
            const b = backups[idx];
            if (!b) return;
            const blob = new Blob([b.data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `MS_Bag_Backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function deleteBackup(idx) {
            backups.splice(idx, 1);
            showToast('🗑️ Backup deleted', 'warning');
            renderBackup();
            saveData(true);
        }

        function clearData() {

            if (!confirm('⚠️ Final warning: This action cannot be undone!')) return;
            localStorage.removeItem(STORAGE_KEY);

        }

        function savePayrollEntry() {
            const employeeName = document.getElementById('payEmpName').value.trim();
            const month = document.getElementById('payMonth').value;
            const salary = parseFloat(document.getElementById('paySalary').value) || 0;
            const bonus = parseFloat(document.getElementById('payBonus').value) || 0;
            const deductions = parseFloat(document.getElementById('payDeductions').value) || 0;
            const netPay = salary + bonus - deductions;
            if (!employeeName) { showToast('Employee name is required', 'error'); return; }
            const entry = {
                id: 'PAY' + String(payroll.length + 1).padStart(4, '0'),
                employeeName: employeeName,
                month: month,
                salary: salary,
                bonus: bonus,
                deductions: deductions,
                netPay: netPay,
                createdAt: new Date().toISOString()
            };
            payroll.push(entry);
            const salaryAcc = chartOfAccounts.find(a => a.name === 'Salary');
            const cashAcc = chartOfAccounts.find(a => a.name === 'Cash');
            if (salaryAcc && cashAcc) {
                postJournalEntry(new Date().toISOString().slice(0, 10), `Salary for ${employeeName} - ${month}`, entry.id, [
                    { accountId: salaryAcc.id, debit: netPay, credit: 0 },
                    { accountId: cashAcc.id, debit: 0, credit: netPay }
                ]);
            }
            closeModal();
            showToast(`👔 Payroll for ${employeeName} saved`, 'success');
            logAudit('PAYROLL', `Payroll for ${employeeName} - ${month}`);
            renderPayrollModule();
            saveData(true);
        }

            const dailySales = invoices.filter(inv => inv.date === today);
            const weeklySales = invoices.filter(inv => inv.date >= weekAgoStr && inv.date <= today);
            const monthlySales = invoices.filter(inv => inv.date.startsWith(month));
            const yearlySales = invoices.filter(inv => inv.date.startsWith(year));
            const branchSales = shops.map(shop => {
                const sales = invoices.filter(inv => inv.shop === shop.shopName);
                return { ...shop, total: sales.reduce((s, inv) => s + inv.grandTotal, 0), count: sales.length };
            });
            const salespersonData = staffMembers.filter(s => s.role === 'Salesman' || s.role === 'Manager').map(staff => {
                const sales = invoices.filter(inv => inv.customerName === staff.name || inv.shop === staff.assignedShops?.[0]);
                return { ...staff, total: sales.reduce((s, inv) => s + inv.grandTotal, 0), count: sales.length };
            });
            const productSales = products.map(p => {
                const sold = invoices.reduce((s, inv) => {
                    const item = inv.items.find(i => i.id === p.id);
                    return s + (item ? item.qty : 0);
                }, 0);
                const revenue = invoices.reduce((s, inv) => {
                    const item = inv.items.find(i => i.id === p.id);
                    return s + (item ? item.lineTotal : 0);
                }, 0);
                return { ...p, sold, revenue };
            }).sort((a, b) => b.revenue - a.revenue);
            const categorySales = CATEGORIES.map(cat => {
                const items = products.filter(p => p.category === cat);

                    return s + invoices.reduce((s2, inv) => {
                        const item = inv.items.find(i => i.id === p.id);
                        return s2 + (item ? item.lineTotal : 0);
                    }, 0);
                }, 0);
                return { category: cat, revenue, count: items.length };
            }).sort((a, b) => b.revenue - a.revenue);
            const discountedInvoices = invoices.filter(inv => inv.discount > 0);

        // ============================================================
        // PRICE TAG MASTER
        // ============================================================
        function renderPriceTagMaster() {
            if (!canView('priceTags')) { showToast('⛔ Access Denied', 'error'); return; }

            const priceMetrics = products.map(p => {
                const profit = p.sellingPrice - (p.costPrice || 0);
                const margin = p.costPrice > 0 ? (profit / p.costPrice * 100) : 0;
                const markup = p.costPrice > 0 ? ((p.sellingPrice / p.costPrice - 1) * 100) : 0;
                const discount = p.mrpPrice > 0 ? ((1 - p.sellingPrice / p.mrpPrice) * 100) : 0;
                return { ...p, profit, margin, markup, discount };
            });

            const totalProducts = products.length;
            const avgMargin = priceMetrics.reduce((s, p) => s + p.margin, 0) / (totalProducts || 1);
            const avgProfit = priceMetrics.reduce((s, p) => s + p.profit, 0) / (totalProducts || 1);
            const lowMarginItems = priceMetrics.filter(p => p.margin < 15);

            let html = `

                        <div class="kpi-card"><div class="kpi-label">Avg Margin</div><div class="kpi-value ${avgMargin>20?'success':'warning'}">${avgMargin.toFixed(1)}%</div></div>
                        <div class="kpi-card"><div class="kpi-label">Low Margin Items</div><div class="kpi-value danger">${lowMarginItems.length}</div></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="navigateTo('printTags')">🖨️ Print Tags</button>
                        <button class="btn btn-success" onclick="exportPriceTagData()">📥 Export Price Data</button>
                        <button class="btn btn-warning" onclick="openBulkPriceUpdate()">📊 Bulk Update</button>
                    </div>
                    <div class="table-wrapper" style="margin-top:10px;">
                        <table><thead><tr><th>Product</th><th>Cost</th><th>Sell</th><th>MRP</th><th>Profit</th><th>Margin</th><th>Action</th></tr></thead>
                        <tbody>${priceMetrics.slice(0,15).map(p=>`
                            <tr>
                                <td><strong>${p.name}</strong></td>
                                <td>${CURRENCY} ${p.costPrice}</td>
                                <td style="color:var(--gold);font-weight:600;">${CURRENCY} ${p.sellingPrice}</td>
                                <td>${CURRENCY} ${p.mrpPrice}</td>

        function calcEditPriceDetails() {
            const cost = parseFloat(document.getElementById('editCostPrice')?.value) || 0;
            const sell = parseFloat(document.getElementById('editSellingPrice')?.value) || 0;
            const mrp = parseFloat(document.getElementById('editMrpPrice')?.value) || 0;
            const purchase = parseFloat(document.getElementById('editPurchasePrice')?.value) || 0;
            const transport = parseFloat(document.getElementById('editTransportCost')?.value) || 0;
            const other = parseFloat(document.getElementById('editOtherExpenses')?.value) || 0;
            const landed = purchase + transport + other;
            const landedEl = document.getElementById('editLandedCost');
            if (landedEl) landedEl.value = landed.toFixed(2);

            const profit = sell - cost;
            const margin = cost > 0 ? (profit / cost * 100) : 0;
            const markup = cost > 0 ? ((sell / cost - 1) * 100) : 0;
            const discount = mrp > 0 ? ((1 - sell / mrp) * 100) : 0;

            const profitEl = document.getElementById('editCalcProfit');
            const marginEl = document.getElementById('editCalcMargin');
            const markupEl = document.getElementById('editCalcMarkup');
            const discountEl = document.getElementById('editCalcDiscount');
            if (profitEl) profitEl.textContent = `${CURRENCY} ${profit.toFixed(2)}`;
            if (marginEl) marginEl.textContent = `${margin.toFixed(1)}%`;
            if (markupEl) markupEl.textContent = `${markup.toFixed(1)}%`;
            if (discountEl) discountEl.textContent = `${discount.toFixed(1)}%`;
        }

        function savePriceEdit(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) { showToast('Product not found', 'error'); return; }

            const oldSell = product.sellingPrice;

            product.purchasePrice = parseFloat(document.getElementById('editPurchasePrice').value) || 0;
            product.supplierCost = parseFloat(document.getElementById('editSupplierCost').value) || 0;
            product.factoryPrice = parseFloat(document.getElementById('editFactoryPrice').value) || 0;
            product.importPrice = parseFloat(document.getElementById('editImportPrice').value) || 0;
            product.transportCost = parseFloat(document.getElementById('editTransportCost').value) || 0;
            product.otherExpenses = parseFloat(document.getElementById('editOtherExpenses').value) || 0;
            product.landedCost = parseFloat(document.getElementById('editLandedCost').value) || 0;
            product.costPrice = parseFloat(document.getElementById('editCostPrice').value) || 0;
            product.sellingPrice = parseFloat(document.getElementById('editSellingPrice').value) || 0;
            product.mrpPrice = parseFloat(document.getElementById('editMrpPrice').value) || 0;
            product.retailPrice = parseFloat(document.getElementById('editRetailPrice').value) || 0;
            product.wholesalePrice = parseFloat(document.getElementById('editWholesalePrice').value) || 0;
            product.dealerPrice = parseFloat(document.getElementById('editDealerPrice').value) || 0;
            product.onlinePrice = parseFloat(document.getElementById('editOnlinePrice').value) || 0;
            product.memberPrice = parseFloat(document.getElementById('editMemberPrice').value) || 0;
            product.festivalOfferPrice = parseFloat(document.getElementById('editFestivalPrice').value) || 0;

            if (oldSell !== product.sellingPrice) {
                priceHistory.push({
                    productId: product.id,
                    productName: product.name,
                    oldPrice: oldSell,
                    newPrice: product.sellingPrice,
                    date: new Date().toISOString(),
                    user: currentUser.name
                });
            }

            closeModal();
            showToast(`✅ Prices updated for ${product.name}`, 'success');
            logAudit('PRICE_EDIT', `Updated prices for ${product.name}`);
            renderPriceTagMaster();
            saveData(true);
        }

                            return `<tr><td><strong>${p.name}</strong></td><td>${CURRENCY} ${p.mrpPrice}</td>
                                <td style="color:var(--gold);">${CURRENCY} ${p.sellingPrice}</td>
                                <td style="color:var(--danger);">${discPct}%</td>
                                <td style="color:var(--success);">${CURRENCY} ${discAmt}</td></tr>`;
                        }).join('')}</tbody></table>
                    </div>

                    <h4 style="margin:12px 0 8px;">📜 Price Change History</h4>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Product</th><th>Old Price</th><th>New Price</th><th>Changed By</th></tr></thead>
                        <tbody>${priceChanges.length===0?'<tr><td colspan="5" class="empty-row">No price changes recorded</td></tr>':
                        priceChanges.map(h=>`
                            <tr><td>${h.date?new Date(h.date).toLocaleDateString():'-'}</td>
                                <td>${h.productName}</td>
                                <td>${CURRENCY} ${h.oldPrice}</td>
                                <td style="color:${h.newPrice>h.oldPrice?'var(--success)':'var(--danger)'}">${CURRENCY} ${h.newPrice}</td>
                                <td>${h.user||'System'}</td></tr>
                        `).join('')}</tbody></table>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="exportPriceReports()">📥 Export All Reports</button>
                        <button class="btn btn-secondary" onclick="showToast('📊 Price analysis generated','success')">📊 Price Analysis</button>
                    </div>
                </div>
            `;
            document.getElementById('pageContent').innerHTML = html;
        }

        function exportPriceReports() {
            const data = products.map(p => ({
                'Name': p.name,
                'SKU': p.sku,
                'Category': p.category,
                'Cost': p.costPrice,
                'Selling': p.sellingPrice,
                'MRP': p.mrpPrice,
                'Profit': p.sellingPrice - (p.costPrice || 0),
                'Margin %': p.costPrice > 0 ? ((p.sellingPrice - p.costPrice) / p.costPrice * 100).toFixed(1) : 0,
                'Discount %': p.mrpPrice > 0 ? ((1 - p.sellingPrice / p.mrpPrice) * 100).toFixed(1) : 0,
                'Stock': p.stock,
                'Sales Count': p.salesCount || 0
            }));
            exportToExcel(data, 'Price_Reports');
            showToast('📥 Price reports exported', 'success');
        }

        // ============================================================
        // GLOBAL SEARCH
        // ============================================================
        function globalSearch() {
            const query = document.getElementById('globalSearch').value.trim().toLowerCase();
            if (!query) return;
            navigateTo('search');
            document.getElementById('searchQuery').value = query;
            performSearch();
        }

        // ============================================================
        // INIT
        // ============================================================
        window.onload = function() {
            document.getElementById('loginEmail').value = 'admin';
            document.getElementById('loginPassword').value = 'admin123';
        };
    </script>
</body>
</html>
