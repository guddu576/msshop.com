<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
<title>MS Bag Shop ERP v9.0</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#0a1628;--primary-light:#1a3050;--bg:#f0f4f8;--card:#ffffff;--text:#1a1a2e;--text-light:#6b7280;--border:#e5e7eb;--shadow:0 4px 24px rgba(0,0,0,0.06);--radius:16px;--radius-sm:10px;--transition:all 0.3s ease;--gold:#d4a843;--danger:#dc2626;--success:#10b981;--warning:#f59e0b;--info:#3b82f6;--sidebar-width:260px;--header-height:60px}
.dark-mode{--bg:#0f0f1a;--card:#1a1a2e;--text:#e2e8f0;--text-light:#94a3b8;--border:#2d3748}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);transition:var(--transition);overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

/* LOGIN */
.login-container{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0a1628,#1a3050);padding:20px;position:relative;overflow:hidden}
.login-card{background:rgba(255,255,255,0.97);padding:2.5rem 2rem;border-radius:var(--radius);width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4);position:relative;z-index:1}
.dark-mode .login-card{background:rgba(26,26,46,0.97)}
.login-card .logo{text-align:center;font-size:4rem}
.login-card h2{text-align:center;color:var(--primary);font-size:1.8rem;font-weight:700}
.dark-mode .login-card h2{color:white}
.login-card h2 span{color:var(--gold)}
.login-card .sub{text-align:center;font-size:13px;color:var(--text-light);margin-bottom:20px}
.login-card .form-group{margin-bottom:12px}
.login-card .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:4px}
.login-card .form-group input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);transition:var(--transition)}
.login-card .form-group input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(212,168,67,0.1)}
.login-card .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:var(--transition);margin-top:8px}
.login-card .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(10,22,40,0.3)}
.login-error{color:#dc2626;text-align:center;margin-top:10px;display:none;font-size:13px}

/* APP */
.app-container{display:none;min-height:100vh}
.app-header{background:var(--primary);padding:0 20px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;height:var(--header-height);z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.2)}
.app-header .left{display:flex;align-items:center;gap:14px}
.app-header .left .menu-btn{background:none;border:none;color:white;font-size:24px;cursor:pointer;padding:4px 8px;border-radius:8px}
.app-header .left .menu-btn:hover{background:rgba(255,255,255,0.1)}
.app-header .left .brand{color:white;font-size:16px;font-weight:700}
.app-header .left .brand span{color:var(--gold)}
.app-header .left .brand small{font-size:10px;font-weight:400;opacity:0.7;margin-left:4px}
.app-header .center{flex:1;max-width:400px;margin:0 16px;position:relative;display:none}
.app-header .center input{width:100%;padding:8px 16px 8px 36px;border:none;border-radius:20px;background:rgba(255,255,255,0.12);color:white;font-size:14px}
.app-header .center input::placeholder{color:rgba(255,255,255,0.6)}
.app-header .center input:focus{background:rgba(255,255,255,0.2);outline:none}
.app-header .center .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.5);font-size:14px}
.app-header .right{display:flex;align-items:center;gap:10px}
.app-header .right .btn-icon{background:none;border:none;color:rgba(255,255,255,0.8);font-size:18px;cursor:pointer;padding:6px;border-radius:8px;position:relative;transition:var(--transition)}
.app-header .right .btn-icon:hover{color:white;background:rgba(255,255,255,0.1)}
.app-header .right .btn-icon .badge{position:absolute;top:0;right:0;background:var(--danger);color:white;font-size:9px;padding:2px 6px;border-radius:50%;min-width:18px;text-align:center}
.app-header .right .user-info{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:20px;background:rgba(255,255,255,0.08);cursor:pointer}
.app-header .right .user-info:hover{background:rgba(255,255,255,0.15)}
.app-header .right .user-info .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:white;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.app-header .right .user-info .name{color:white;font-size:13px;font-weight:500}
.app-header .right .user-info .role{color:rgba(255,255,255,0.6);font-size:10px}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:-100%;width:var(--sidebar-width);height:100%;background:var(--card);z-index:200;transition:left 0.3s;overflow-y:auto;box-shadow:4px 0 30px rgba(0,0,0,0.08);padding-top:var(--header-height);border-right:1px solid var(--border)}
.sidebar.open{left:0}
.sidebar .inner{padding:8px 0 80px}
.sidebar .brand-side{padding:0 20px 16px;border-bottom:1px solid var(--border);text-align:center}
.sidebar .brand-side h2{color:var(--primary);font-size:1.1rem;font-weight:700}
.dark-mode .sidebar .brand-side h2{color:white}
.sidebar .brand-side h2 span{color:var(--gold)}
.sidebar .brand-side .ver{font-size:9px;color:var(--text-light)}
.sidebar .nav-section{font-size:9px;text-transform:uppercase;color:var(--text-light);padding:14px 20px 4px;font-weight:700;letter-spacing:1px}
.sidebar .nav-item{display:block;width:100%;padding:9px 20px;background:none;border:none;color:var(--text);text-align:left;font-size:13px;cursor:pointer;transition:var(--transition);border-left:3px solid transparent;font-weight:500}
.sidebar .nav-item:hover{background:var(--bg);color:var(--primary)}
.sidebar .nav-item.active{background:var(--bg);border-left-color:var(--gold);color:var(--primary)}
.sidebar .nav-item .icon{margin-right:10px;font-size:15px}
.sidebar .nav-divider{height:1px;background:var(--border);margin:6px 20px}
.sidebar .nav-logout{color:var(--danger) !important}
.sidebar .nav-logout:hover{background:#fee2e2 !important}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;display:none}
.sidebar-overlay.show{display:block}

/* MAIN */
.main-content{padding-top:var(--header-height);padding-bottom:20px;max-width:1440px;margin:0 auto;min-height:100vh}
.page-header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.page-header h1{font-size:20px;font-weight:700}
.page-content{padding:0 16px 16px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:none;justify-content:space-around;padding:4px 0;box-shadow:0 -2px 20px rgba(0,0,0,0.08);z-index:100;border-top:1px solid var(--border)}
.bottom-nav button{background:none;border:none;padding:4px 6px;font-size:9px;color:var(--text-light);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.bottom-nav button .nav-icon{font-size:18px}
.bottom-nav button.active{color:var(--primary);font-weight:600}

/* CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--card);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.kpi-card .kpi-label{font-size:10px;color:var(--text-light);text-transform:uppercase;font-weight:600}
.kpi-card .kpi-value{font-size:22px;font-weight:700;color:var(--primary);margin-top:2px}
.dark-mode .kpi-card .kpi-value{color:white}
.kpi-card .kpi-value.gold{color:var(--gold)}
.kpi-card .kpi-value.danger{color:var(--danger)}
.kpi-card .kpi-value.success{color:var(--success)}
.section-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.section-card .card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--primary);flex-wrap:wrap}
.dark-mode .section-card .card-title{color:white}
.section-card .card-title .badge{background:var(--gold);color:white;font-size:10px;padding:2px 10px;border-radius:20px;font-weight:600}
.btn{padding:8px 20px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{transform:translateY(-1px)}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{transform:translateY(-1px)}
.btn-warning{background:var(--warning);color:white}
.btn-warning:hover{transform:translateY(-1px)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#d1d5db}
.btn-gold{background:var(--gold);color:white}
.btn-gold:hover{transform:translateY(-1px)}
.btn-sm{padding:4px 12px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* TABLE */
.table-wrapper{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:500px}
table th,table td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
table th{background:var(--bg);font-weight:700;color:var(--text-light);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;position:sticky;top:0;z-index:5}
table tr:hover td{background:var(--bg)}
table .empty-row td{text-align:center;color:var(--text-light);padding:24px}
.badge-status{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600}
.badge-paid{background:var(--success);color:white}
.badge-pending{background:var(--warning);color:white}
.badge-partial{background:#8b5cf6;color:white}
.badge-active{background:var(--success);color:white}
.badge-inactive{background:var(--danger);color:white}
.badge-low{background:var(--warning);color:white}
.badge-out{background:var(--danger);color:white}

/* FORMS */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--text-light);text-transform:uppercase;letter-spacing:0.3px}
.form-group label .req{color:var(--danger)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);transition:var(--transition)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(212,168,67,0.1)}
.form-group input[readonly]{background:var(--border);cursor:not-allowed}
.form-group .help{font-size:10px;color:var(--text-light);margin-top:2px;display:block}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;padding:20px;overflow-y:auto}
.modal-overlay.active{display:flex;align-items:center;justify-content:center}
.modal-content{background:var(--card);border-radius:var(--radius);max-width:1000px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp 0.3s ease;border:1px solid var(--border)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.modal-header h3{color:var(--primary);font-size:1.1rem;font-weight:700}
.dark-mode .modal-header h3{color:white}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px 8px;border-radius:8px}
.modal-close:hover{background:var(--bg)}
.modal-body{max-height:calc(90vh - 120px);overflow-y:auto}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto;flex-wrap:nowrap}
.tab{background:none;border:none;padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:var(--transition)}
.tab:hover{color:var(--primary);background:var(--bg)}
.tab.active{color:var(--primary);border-bottom-color:var(--gold)}
.dark-mode .tab.active{color:white}
.tab-content{display:none}
.tab-content.active{display:block}

/* TOAST */
.toast-message{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:12px 24px;border-radius:12px;z-index:999;font-weight:600;box-shadow:0 8px 40px rgba(0,0,0,0.2);animation:slideUp 0.3s ease;max-width:90%;text-align:center}
.toast-message.success{background:var(--success)}
.toast-message.error{background:var(--danger)}
.toast-message.warning{background:var(--warning)}
.auto-save-indicator{position:fixed;bottom:70px;right:16px;background:var(--primary);color:white;padding:4px 14px;border-radius:20px;font-size:10px;z-index:1000;opacity:0.9;transition:all 0.3s ease}
.auto-save-indicator.saved{background:var(--success)}
.auto-save-indicator.error{background:var(--danger)}

.alert-item{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid}
.alert-item.warning{background:#fef3c7;border-color:var(--warning)}
.alert-item.danger{background:#fee2e2;border-color:var(--danger)}
.alert-item.success{background:#d1fae5;border-color:var(--success)}
.alert-item.info{background:#dbeafe;border-color:var(--info)}
.dark-mode .alert-item.warning{background:#1a1a00;color:#fcd34d}
.dark-mode .alert-item.danger{background:#1a0000;color:#fca5a5}
.dark-mode .alert-item.success{background:#001a00;color:#6ee7b7}
.dark-mode .alert-item.info{background:#001a2a;color:#93c5fd}

.pos-product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px;max-height:260px;overflow-y:auto}
.pos-product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;text-align:center;cursor:pointer;transition:var(--transition)}
.pos-product-card:hover{transform:scale(1.03);border-color:var(--gold)}
.pos-product-card .img-wrap{width:100%;height:60px;overflow:hidden;border-radius:4px;background:var(--bg)}
.pos-product-card .img-wrap img{width:100%;height:100%;object-fit:contain}
.pos-product-card .p-name{font-size:10px;font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-product-card .p-price{font-size:11px;font-weight:700;color:var(--gold)}
.pos-product-card .p-stock{font-size:9px;color:var(--text-light)}

.invoice-print{max-width:800px;margin:0 auto;background:white;color:#1a1a2e;padding:24px;border-radius:var(--radius)}
.invoice-print .header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:14px}
.invoice-print .header .company h2{color:#0a1628;font-size:22px}
.invoice-print .header .company h2 span{color:#d4a843}
.invoice-print .header .company p{font-size:12px;color:#666}
.invoice-print .header .meta{text-align:right;font-size:13px}
.invoice-print .customer{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8f9fa;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.invoice-print .customer .label{color:#666;font-weight:600}
.invoice-print table{width:100%;border-collapse:collapse;margin-bottom:14px}
.invoice-print table th{background:#0a1628;color:white;padding:6px 10px;font-size:10px;text-transform:uppercase;position:static}
.invoice-print table td{padding:6px 10px;border-bottom:1px solid #eee;font-size:13px}
.invoice-print .totals{text-align:right;padding:10px 14px;background:#f8f9fa;border-radius:8px;margin-top:10px}
.invoice-print .totals div{padding:3px 0;font-size:14px}
.invoice-print .totals .grand{font-size:20px;font-weight:700;color:#d4a843}
.invoice-print .footer{text-align:center;margin-top:16px;padding-top:10px;border-top:1px solid #eee;font-size:12px;color:#666}

.result-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center}
.result-item:hover{background:var(--bg)}

/* IMAGE UPLOAD */
.img-upload-area{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;transition:var(--transition);background:var(--bg)}
.img-upload-area:hover{border-color:var(--gold);background:rgba(212,168,67,0.05)}
.img-upload-area.dragover{border-color:var(--gold);background:rgba(212,168,67,0.1)}
.img-upload-area .icon{font-size:32px;color:var(--text-light);margin-bottom:8px}
.img-upload-area .text{font-size:12px;color:var(--text-light)}
.img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px}
.img-item{position:relative;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--border);aspect-ratio:1}
.img-item img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.img-item .remove{position:absolute;top:4px;right:4px;background:rgba(220,38,38,0.9);color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.img-item .primary-badge{position:absolute;bottom:4px;left:4px;background:var(--gold);color:white;font-size:8px;padding:1px 6px;border-radius:8px;font-weight:600}

/* VARIANTS */
.variant-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.variant-table th,.variant-table td{padding:6px 8px;border:1px solid var(--border);text-align:left}
.variant-table th{background:var(--bg);font-size:10px;text-transform:uppercase}
.variant-table input{padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;width:100%;background:var(--bg);color:var(--text)}

/* REPORT FILTER */
.report-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:14px}
.report-filter .form-group{margin-bottom:0}
.chart-container{position:relative;height:280px;margin-top:10px}

/* THUMBNAIL */
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer}

@media(max-width:600px){
  .form-row-2,.form-row-3{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:768px){
  .sidebar{left:0 !important}
  .main-content{margin-left:var(--sidebar-width)}
  .app-header .left .menu-btn{display:none}
  .app-header .center{display:block}
  .bottom-nav{display:none !important}
  .sidebar-overlay{display:none !important}
}
@media(max-width:767px){
  .sidebar{left:-100% !important;width:85%;max-width:300px}
  .sidebar.open{left:0 !important}
  .app-header .center{display:none}
  .bottom-nav{display:flex !important}
  .main-content{padding-bottom:65px}
  .page-header h1{font-size:17px}
  .page-content{padding:0 10px 10px}
  .app-header .right .user-info .role{display:none}
}
@media print{.sidebar,.app-header,.bottom-nav,.no-print{display:none !important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        <div class="logo">👜</div>
        <h2>MS <span>Bag Shop</span></h2>
        <div class="sub">Enterprise ERP v9.0</div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginEmail" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">

function today(){return new Date().toISOString().slice(0,10);}
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtMoney(n){return CURRENCY+' '+(Number(n)||0).toFixed(2);}
function showToast(msg,type){

  document.body.appendChild(div);

}

function exportToExcel(data,filename){
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb,ws,'Sheet1');

function getAccountBalance(accountId){
  let balance=0;
  const account=chartOfAccounts.find(a=>a.id===accountId);
  if(!account)return 0;
  journalEntries.forEach(entry=>{
    const line=entry.lines.find(l=>l.accountId===accountId);
    if(line){
      if(account.normalBalance==='Debit')balance+=(line.debit||0)-(line.credit||0);
      else balance+=(line.credit||0)-(line.debit||0);
    }
  });
  return balance;
}

    ${notifications.length?`<button class="btn btn-sm btn-danger" onclick="clearAllNotifications()">Clear All</button>`:''}
  </div>`;
  if(!notifications.length){html+='<p style="text-align:center;padding:20px;color:var(--text-light);">No notifications</p>';}
  else{html+=notifications.map(n=>`<div style="padding:8px 12px;border-bottom:1px solid var(--border);${n.read?'opacity:0.6;':''}">
    <div>${esc(n.message)}</div>
    <div style="font-size:10px;color:var(--text-light);margin-top:3px;">${esc(n.time)}</div>
  </div>`).join('');}
  openModal('🔔 Notifications',html);
}

/* LOGIN */
function login(){
  const username=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value.trim();
  const err=document.getElementById('loginError');
  if(!username||!password){err.textContent='Enter credentials';err.style.display='block';return;}
  if(!userAccounts||userAccounts.length===0)setDefaultData();
  const user=userAccounts.find(u=>u.username===username&&u.password===password);
  if(!user){err.textContent='Invalid credentials';err.style.display='block';return;}
  if(user.status!=='Active'){err.textContent='Account deactivated';err.style.display='block';return;}
  const staff=staffMembers.find(s=>s.id===user.staffId);
  currentUser={id:user.id,name:staff?staff.name:user.fullName,role:user.role||'Salesman',username:user.username,staffId:user.staffId};
  user.lastLogin=new Date().toISOString();
  document.getElementById('loginContainer').style.display='none';
  document.getElementById('appContainer').style.display='block';
  const initials=currentUser.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('userAvatar').textContent=initials||'U';
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userRole').textContent=currentUser.role;
  buildSidebar(currentUser.role);buildBottomNav(currentUser.role);
  navigateTo('dashboard');
  err.style.display='none';
  addNotification(`${currentUser.name} logged in`,'success');
  logAudit('LOGIN',`User ${currentUser.name} logged in`);
  saveData(false);
}

  if(currentUser){addNotification(`${currentUser.name} logged out`,'info');logAudit('LOGOUT',`User ${currentUser.name} logged out`);}
  currentUser=null;

/* SIDEBAR */
function buildSidebar(role){
  const menu=POSITION_MENUS[role]||POSITION_MENUS['Salesman'];
  const nav=document.getElementById('sidebarNav');if(!nav)return;
  let html='';
  menu.sections.forEach(sec=>{
    html+=`<div class="nav-section">${sec.name}</div>`;
    sec.items.forEach(item=>{
      const target=NAV_TARGETS[item.id]||item.id;
      html+=`<button class="nav-item" data-nav="${target}" onclick="navigateTo('${target}')"><span class="icon">${item.icon}</span> ${item.label}</button>`;
    });
  });
  nav.innerHTML=html;
}
function buildBottomNav(role){
  const menu=POSITION_MENUS[role]||POSITION_MENUS['Salesman'];
  const nav=document.getElementById('bottomNav');if(!nav)return;
  let items=[];
  if(menu.sections.length>0)items=menu.sections[0].items.slice(0,4);
  if(items.length<5&&menu.sections.length>1)items=items.concat(menu.sections[1].items.slice(0,5-items.length));
  let html='';
  items.forEach(item=>{
    const target=NAV_TARGETS[item.id]||item.id;
    html+=`<button data-nav="${target}" onclick="navigateTo('${target}')"><span class="nav-icon">${item.icon}</span> ${item.label.substring(0,6)}</button>`;
  });
  nav.innerHTML=html;
}

/* NAVIGATION */
function canAccess(section){
  if(!currentUser)return false;
  if(currentUser.role==='Super Admin')return true;
  const menu=POSITION_MENUS[currentUser.role];if(!menu)return false;
  let allowed=false;
  menu.sections.forEach(sec=>sec.items.forEach(it=>{if(NAV_TARGETS[it.id]===section)allowed=true;}));
  return allowed;
}
function navigateTo(section){
  if(currentUser&&currentUser.role!=='Super Admin'&&!canAccess(section)){showToast('⛔ Access denied','error');return;}
  document.getElementById('pageTitle').textContent=TITLES[section]||section;
  closeSidebar();
  document.querySelectorAll('.sidebar .nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===section));
  document.querySelectorAll('.bottom-nav button').forEach(el=>el.classList.toggle('active',el.dataset.nav===section));
  const renderMap={
    dashboard:renderDashboard,search:renderSearch,pos:renderPOS,invoices:renderInvoices,
    products:renderProducts,inventory:renderInventory,shops:renderShops,
    purchases:renderPurchases,suppliers:renderSuppliers,transfers:renderTransfers,
    customers:renderCustomers,coa:renderCOA,cashbank:renderCashBank,
    expenses:renderExpenses,tax:renderTax,priceTags:renderPriceTags,printTags:renderPrintTags,
    reportsDashboard:renderReportsDashboard,salesReports:renderSalesReports,
    inventoryReports:renderInventoryReports,purchaseReports:renderPurchaseReports,
    customerReports:renderCustomerReports,shopReports:renderShopReports,
    itemReports:renderItemReports,dateReports:renderDateReports,
    businessAnalytics:renderAnalytics,users:renderUsers,backup:renderBackup,
    settings:renderSettings,auditReports:renderAuditReports,cashClosing:renderCashClosing
  };
  if(renderMap[section]){
    try{renderMap[section]();}
    catch(e){console.error(e);document.getElementById('pageContent').innerHTML=`<div class="section-card"><p style="color:var(--danger)">Error: ${esc(e.message)}</p></div>`;}
  }else{document.getElementById('pageContent').innerHTML='<div class="section-card"><p>Under construction</p></div>';}
}
function globalSearch(){
  const q=document.getElementById('globalSearch')?.value.trim();if(!q)return;
  navigateTo('search');
  setTimeout(()=>{const inp=document.getElementById('searchQuery');if(inp){inp.value=q;performSearch();}},60);
}

/* DASHBOARD */
function renderDashboard(){
  const totalSales=invoices.reduce((s,i)=>s+i.grandTotal,0);
  const totalExpenses=expenses.reduce((s,e)=>s+e.amount,0);
  const netProfit=totalSales-totalExpenses;
  const totalStock=products.reduce((s,p)=>s+(p.stock||0),0);
  const invValue=products.reduce((s,p)=>s+((p.stock||0)*(p.costPrice||0)),0);
  const lowStock=products.filter(p=>(p.stock||0)<=(p.minStock||5)&&(p.stock||0)>0).length;
  const outStock=products.filter(p=>(p.stock||0)===0).length;
  const alerts=[];
  products.forEach(p=>{
    if((p.stock||0)===0)alerts.push({type:'danger',message:`🚫 Out: ${esc(p.name)}`});
    else if((p.stock||0)<=(p.minStock||5))alerts.push({type:'warning',message:`⚠️ Low: ${esc(p.name)} (${p.stock})`});
  });
  let html=`<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">💰 Sales</div><div class="kpi-value gold">${fmtMoney(totalSales)}</div></div>
    <div class="kpi-card"><div class="kpi-label">💸 Expenses</div><div class="kpi-value danger">${fmtMoney(totalExpenses)}</div></div>
    <div class="kpi-card"><div class="kpi-label">📈 Net Profit</div><div class="kpi-value ${netProfit>=0?'gold':'danger'}">${fmtMoney(netProfit)}</div></div>
    <div class="kpi-card"><div class="kpi-label">📦 Total Stock</div><div class="kpi-value">${totalStock}</div></div>
    <div class="kpi-card"><div class="kpi-label">📦 Value</div><div class="kpi-value">${fmtMoney(invValue)}</div></div>
    <div class="kpi-card"><div class="kpi-label">⚠️ Low</div><div class="kpi-value danger">${lowStock}</div></div>
    <div class="kpi-card"><div class="kpi-label">🚫 Out</div><div class="kpi-value danger">${outStock}</div></div>
    <div class="kpi-card"><div class="kpi-label">🧾 Invoices</div><div class="kpi-value">${invoices.length}</div></div>
    <div class="kpi-card"><div class="kpi-label">👥 Customers</div><div class="kpi-value">${customers.length}</div></div>
  </div>`;
  if(alerts.length){
    html+=`<div class="section-card"><div class="card-title">🔔 Alerts <span class="badge">${alerts.length}</span></div>
      ${alerts.slice(0,8).map(a=>`<div class="alert-item ${a.type}">${a.message}</div>`).join('')}</div>`;
  }
  html+=`<div class="section-card"><div class="card-title">⚡ Quick Actions</div>
    <div class="btn-group">
      ${canAccess('pos')?`<button class="btn btn-success" onclick="navigateTo('pos')">🛒 New Sale</button>`:''}
      ${canAccess('products')?`<button class="btn btn-gold" onclick="showProductModal()">➕ New Product</button>`:''}
      ${canAccess('purchases')?`<button class="btn btn-warning" onclick="navigateTo('purchases')">📥 Purchase</button>`:''}
      ${canAccess('customers')?`<button class="btn btn-secondary" onclick="navigateTo('customers')">👤 Customers</button>`:''}
      ${canAccess('dateReports')?`<button class="btn btn-primary" onclick="navigateTo('dateReports')">📅 Reports</button>`:''}
    </div></div>`;
  document.getElementById('pageContent').innerHTML=html;
}

function renderProducts(){

  document.getElementById('pageContent').innerHTML=`
    <div class="section-card">
      <div class="card-title">🏷️ Products <span class="badge">${products.length}</span></div>
      <div class="btn-group">

function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById(tabId)?.classList.add('active');

/* IMAGES */
function handleImageSelect(e){
  const files=e.target.files;
  if(!files.length)return;
  Array.from(files).forEach(file=>{
    if(file.size>2*1024*1024){showToast(`${file.name} too large (max 2MB)`,'error');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      window._tempProductImages.push(ev.target.result);
      renderImageGallery();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}
function handleImageDrop(e,area){
  e.preventDefault();area.classList.remove('dragover');
  const files=e.dataTransfer.files;
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    if(file.size>2*1024*1024){showToast('File too large','error');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      window._tempProductImages.push(ev.target.result);
      renderImageGallery();
    };
    reader.readAsDataURL(file);
  });
}
function addImageByUrl(){
  const url=document.getElementById('imgUrlInput').value.trim();
  if(!url)return;
  window._tempProductImages.push(url);
  document.getElementById('imgUrlInput').value='';
  renderImageGallery();
}
function renderImageGallery(){
  const g=document.getElementById('imgGallery');if(!g)return;
  if(!window._tempProductImages.length){g.innerHTML='<p style="color:var(--text-light);font-size:12px;text-align:center;padding:20px;">No images yet</p>';return;}
  g.innerHTML=window._tempProductImages.map((img,idx)=>`
    <div class="img-item">
      <img src="${esc(img)}" onclick="window.open(this.src,'_blank')">
      ${idx===0?'<span class="primary-badge">MAIN</span>':`<button class="btn btn-sm" style="position:absolute;bottom:4px;left:4px;padding:1px 6px;font-size:8px;background:var(--gold);color:white;" onclick="setPrimaryImage(${idx})">Set Main</button>`}
      <button class="remove" onclick="removeImage(${idx})">✕</button>
    </div>`).join('');
}
function removeImage(idx){
  window._tempProductImages.splice(idx,1);
  renderImageGallery();
}
function setPrimaryImage(idx){
  const img=window._tempProductImages.splice(idx,1)[0];
  window._tempProductImages.unshift(img);
  renderImageGallery();
}

/* VARIANTS */
function renderVariantTable(variants){
  window._tempVariants=variants||[];
  const c=document.getElementById('variantsContainer');if(!c)return;
  if(!window._tempVariants.length){
    c.innerHTML='<p style="color:var(--text-light);font-size:12px;padding:20px;text-align:center;">No variants — the base product is used as-is.</p>';
    return;
  }
  c.innerHTML=`<div style="overflow-x:auto;"><table class="variant-table">
    <thead><tr><th>Color</th><th>Size</th><th>SKU</th><th>Barcode</th><th>Cost</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody>${window._tempVariants.map((vr,i)=>`<tr>
      <td><input value="${esc(vr.color||'')}" onchange="updateVariant(${i},'color',this.value)"></td>
      <td><input value="${esc(vr.size||'')}" onchange="updateVariant(${i},'size',this.value)"></td>
      <td><input value="${esc(vr.sku||'')}" onchange="updateVariant(${i},'sku',this.value)"></td>
      <td><input value="${esc(vr.barcode||'')}" onchange="updateVariant(${i},'barcode',this.value)"></td>
      <td><input type="number" step="0.01" value="${vr.cost||0}" onchange="updateVariant(${i},'cost',this.value)"></td>
      <td><input type="number" step="0.01" value="${vr.price||0}" onchange="updateVariant(${i},'price',this.value)"></td>
      <td><input type="number" value="${vr.stock||0}" onchange="updateVariant(${i},'stock',this.value)"></td>
      <td><button class="btn btn-sm btn-danger" onclick="removeVariantRow(${i})">✕</button></td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}
function addVariantRow(){
  if(!window._tempVariants)window._tempVariants=[];
  window._tempVariants.push({color:'',size:'',sku:'',barcode:'',cost:0,price:0,stock:0});
  renderVariantTable(window._tempVariants);
}
function removeVariantRow(idx){
  window._tempVariants.splice(idx,1);
  renderVariantTable(window._tempVariants);
}
function updateVariant(idx,field,value){
  if(!window._tempVariants||!window._tempVariants[idx])return;
  window._tempVariants[idx][field]=['cost','price','stock'].includes(field)?parseFloat(value)||0:value;
}

/* SAVE PRODUCT */
function saveProduct(id){
  const name=document.getElementById('pName').value.trim();
  const sku=document.getElementById('pSku').value.trim();
  if(!name||!sku){showToast('Name and SKU required','error');return;}
  // Duplicate SKU check
  const dup=products.find(p=>p.sku===sku&&p.id!==id);
  if(dup){showToast(`SKU ${sku} already exists`,'error');return;}
  const barcode=document.getElementById('pBarcode').value.trim();
  if(barcode){
    const dupB=products.find(p=>p.barcode===barcode&&p.id!==id);
    if(dupB){showToast(`Barcode already exists`,'error');return;}
  }
  
  const data={
    name,sku,barcode,
    productType:document.getElementById('pProductType').value,
    internalRef:document.getElementById('pInternalRef').value.trim(),
    description:document.getElementById('pDesc').value.trim(),
    status:document.getElementById('pStatus').value,
    salesEnabled:document.getElementById('pSalesEnabled').value,
    purchaseEnabled:document.getElementById('pPurchaseEnabled').value,
    inventoryTracked:document.getElementById('pInventoryTracked').value,
    bagType:document.getElementById('pBagType').value,
    intendedCustomer:document.getElementById('pIntendedCustomer').value,
    usage:document.getElementById('pUsage').value,
    material:document.getElementById('pMaterial').value.trim(),
    outerFabric:document.getElementById('pOuterFabric').value.trim(),
    innerLining:document.getElementById('pInnerLining').value.trim(),
    hardware:document.getElementById('pHardware').value.trim(),
    closure:document.getElementById('pClosure').value.trim(),
    strap:document.getElementById('pStrap').value.trim(),
    handle:document.getElementById('pHandle').value.trim(),
    mainCompartments:parseInt(document.getElementById('pMainCompart').value)||1,
    additionalPockets:parseInt(document.getElementById('pAddPockets').value)||0,
    laptopCompartment:document.getElementById('pLaptopComp').value,
    laptopSize:document.getElementById('pLaptopSize').value.trim(),
    waterproof:document.getElementById('pWaterproof').value,
    lockable:document.getElementById('pLockable').value,
    capacity:parseFloat(document.getElementById('pCapacity').value)||0,
    weight:parseFloat(document.getElementById('pWeight').value)||0,
    length:parseFloat(document.getElementById('pLength').value)||0,
    width:parseFloat(document.getElementById('pWidth').value)||0,
    height:parseFloat(document.getElementById('pHeight').value)||0,
    warranty:document.getElementById('pWarranty').value.trim(),
    origin:document.getElementById('pOrigin').value.trim(),
    subcategory:document.getElementById('pSubcategory').value.trim(),
    category:document.getElementById('pCategory').value,
    brand:document.getElementById('pBrand').value,
    manufacturer:document.getElementById('pManufacturer').value.trim(),
    collection:document.getElementById('pCollection').value.trim(),
    department:document.getElementById('pDepartment').value.trim(),
    tags:document.getElementById('pTags').value.trim(),
    abc:document.getElementById('pABC').value,
    costingMethod:document.getElementById('pCostingMethod').value,
    warehouse:document.getElementById('pWarehouse').value,
    zone:document.getElementById('pZone').value.trim(),
    aisle:document.getElementById('pAisle').value.trim(),
    rack:document.getElementById('pRack').value.trim(),
    shelf:document.getElementById('pShelf').value.trim(),
    bin:document.getElementById('pBin').value.trim(),
    maxCapacity:parseInt(document.getElementById('pMaxCapacity').value)||0,
    storageNotes:document.getElementById('pStorageNotes').value.trim(),
    costPrice:parseFloat(document.getElementById('pCostPrice').value)||0,
    sellingPrice:parseFloat(document.getElementById('pSellingPrice').value)||0,
    mrpPrice:parseFloat(document.getElementById('pMrpPrice').value)||0,
    wholesalePrice:parseFloat(document.getElementById('pWholesalePrice').value)||0,
    minSellingPrice:parseFloat(document.getElementById('pMinPrice').value)||0,
    maxDiscount:parseFloat(document.getElementById('pMaxDiscount').value)||0,
    taxCategory:document.getElementById('pTaxCategory').value,
    commissionEligible:document.getElementById('pCommissionEligible').value,
    color:document.getElementById('pColor').value.trim(),
    size:document.getElementById('pSize').value.trim(),
    stock:parseInt(document.getElementById('pStock').value)||0,
    minStock:parseInt(document.getElementById('pMinStock').value)||5,
    maxStock:parseInt(document.getElementById('pMaxStock').value)||100,
    reorderPoint:parseInt(document.getElementById('pReorderPoint').value)||10,
    safetyStock:parseInt(document.getElementById('pSafetyStock').value)||5,
    leadTime:parseInt(document.getElementById('pLeadTime').value)||7,
    reorderQty:parseInt(document.getElementById('pReorderQty').value)||20,
    preferredSupplier:document.getElementById('pPreferredSupplier').value,
    moq:parseInt(document.getElementById('pMOQ').value)||1,
    images:window._tempProductImages.slice(),
    variants:window._tempVariants?window._tempVariants.slice():[]
  };
  
  if(id){
    const p=products.find(pr=>pr.id===id);
    if(!p)return;
    const oldPrice=p.sellingPrice;
    Object.assign(p,data);
    p.updatedAt=new Date().toISOString();
    p.updatedBy=currentUser?.name||'System';
    if(oldPrice!==data.sellingPrice){
      priceHistory.push({productId:p.id,oldPrice,newPrice:data.sellingPrice,date:new Date().toISOString(),user:currentUser?.name||'System'});
    }
    logAudit('UPDATE_PRODUCT',`Product ${p.name} updated`);

  }

  closeModal();
  showToast('✅ Product saved','success');
  renderProducts();
}

  const p=products.find(pr=>pr.id===id);

  products=products.filter(pr=>pr.id!==id);

}

    <table class="variant-table"><thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Shop</th></tr></thead>
    <tbody>${movements.slice(-20).reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td style="color:${m.qty<0?'var(--danger)':'var(--success)'}">${m.qty>0?'+':''}${m.qty}</td><td>${esc(m.shop||'')}</td></tr>`).join('')}</tbody></table>`;

  if(!priceChanges.length&&!movements.length){html+='<p style="text-align:center;padding:20px;color:var(--text-light);">No history yet</p>';}
  openModal('📜 Product History',html);
}

  const rows=products.map(p=>`
    <tr>
      <td><strong>${esc(p.name)}</strong></td>
      <td>${p.stock}</td>
      <td>${p.minStock}</td>
      <td>${fmtMoney(p.stock*p.costPrice)}</td>
      <td>${p.stock===0?'<span class="badge-status badge-out">Out</span>':(p.stock<=p.minStock?'<span class="badge-status badge-low">Low</span>':'<span class="badge-status badge-active">OK</span>')}</td>
      <td><button class="btn btn-sm btn-primary" onclick="adjustStock('${p.id}')">🔧</button></td>
    </tr>`).join('');
  document.getElementById('pageContent').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Products</div><div class="kpi-value">${products.length}</div></div>

    </div>
    <div class="section-card">
      <div class="card-title">📦 Inventory</div>
      <div class="table-wrapper"><table>
        <thead><tr><th>Product</th><th>Stock</th><th>Min</th><th>Value</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows||'<tr class="empty-row"><td colspan="6">No products</td></tr>'}</tbody>
      </table></div>

function adjustStock(id){
  const p=products.find(pr=>pr.id===id);if(!p)return;
  openModal('🔧 Adjust Stock',`
    <div class="form-group"><label>Product</label><input value="${esc(p.name)}" readonly></div>
    <div class="form-group"><label>Current</label><input value="${p.stock}" readonly></div>
    <div class="form-group"><label>Adjustment (+/−)</label><input id="adjQty" type="number" value="0"></div>
    <div class="form-group"><label>Reason</label><input id="adjReason" placeholder="e.g. Damage, correction"></div>
    <div class="btn-group">
      <button class="btn btn-gold" onclick="saveAdjustment('${p.id}')">💾 Apply</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
}
function saveAdjustment(id){
  const p=products.find(pr=>pr.id===id);if(!p)return;
  const qty=parseInt(document.getElementById('adjQty').value)||0;
  const reason=document.getElementById('adjReason').value.trim()||'Adjustment';
  if(!qty){showToast('Cannot be 0','error');return;}
  p.stock=Math.max(0,p.stock+qty);
  stockMovements.push({id:'SM'+String(stockMovements.length+1).padStart(5,'0'),productId:p.id,productName:p.name,type:'ADJUSTMENT',qty,shop:p.warehouse,reference:reason,date:today(),user:currentUser?.name||'System'});
  logAudit('STOCK_ADJUSTMENT',`${p.name}: ${qty>0?'+':''}${qty}`);
  saveData(true);closeModal();renderInventory();showToast('✅ Adjusted','success');
}

  else{r.innerHTML=`<div class="result-item" onclick="posCreateCustomer('${esc(q).replace(/'/g,"\\'")}')">➕ Create: ${esc(q)}</div>`;}

function posSelectCustomer(id){
  const c=customers.find(x=>x.id===id);if(!c)return;
  document.getElementById('posCustomer').value=c.fullName;
  document.getElementById('posCustomerPhone').value=c.mobile;

  customers.push(c);posSelectCustomer(c.id);showToast('✅ Customer created','success');saveData(true);
}
function posSearchProduct(){
  const q=document.getElementById('posProductSearch').value.trim().toLowerCase();
  const r=document.getElementById('posProductResults');
  if(!q){r.innerHTML='';return;}
  const m=products.filter(p=>p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').includes(q));
  if(!m.length){r.innerHTML='<div class="result-item">No products found</div>';return;}
  r.innerHTML=m.slice(0,8).map(p=>`<div class="result-item" onclick="posAddProduct('${p.id}')"><div><strong>${esc(p.name)}</strong><br><span style="font-size:10px;color:var(--text-light);">${esc(p.sku||'')} · Stock: ${p.stock}</span></div><div style="color:var(--gold);font-weight:700;">${fmtMoney(p.sellingPrice)}</div></div>`).join('');
}
function posAddFirstMatch(){
  const q=document.getElementById('posProductSearch').value.trim().toLowerCase();
  const m=products.find(p=>(p.barcode||'')===q||(p.sku||'').toLowerCase()===q||p.name.toLowerCase().includes(q));
  if(m)posAddProduct(m.id);else showToast('No match','error');
}
function posAddProduct(id){
  const p=products.find(pr=>pr.id===id);if(!p){showToast('Not found','error');return;}
  const qty=parseInt(document.getElementById('posQty').value)||1;
  if(qty>p.stock){showToast(`Only ${p.stock} in stock`,'error');return;}
  const ex=posCart.find(i=>i.id===p.id);
  if(ex){if(ex.qty+qty>p.stock){showToast('Insufficient stock','error');return;}ex.qty+=qty;ex.lineTotal=ex.qty*ex.price;}
  else posCart.push({id:p.id,name:p.name,price:p.sellingPrice,cost:p.costPrice,qty,lineTotal:qty*p.sellingPrice,stock:p.stock});
  document.getElementById('posProductSearch').value='';
  document.getElementById('posProductResults').innerHTML='';
  document.getElementById('posQty').value=1;
  posUpdateCart();
  showToast(`✅ ${p.name}`,'success');
}
function posRemoveFromCart(idx){posCart.splice(idx,1);posUpdateCart();}
function posClearCart(){if(posCart.length&&confirm('Clear?')){posCart=[];posUpdateCart();}}
function posUpdateCart(){
  const c=document.getElementById('posCart');if(!c)return;
  document.getElementById('cartCount').textContent=posCart.length;
  if(!posCart.length){c.innerHTML='<p style="color:var(--text-light);padding:10px;text-align:center;">Empty</p>';posCalcTotals();return;}
  c.innerHTML=`<div class="table-wrapper"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody>
    ${posCart.map((it,i)=>`<tr><td>${esc(it.name)}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="posChangeQty(${i},-1)">−</button> ${it.qty} <button class="btn btn-sm btn-secondary" onclick="posChangeQty(${i},1)">+</button></td>
      <td>${fmtMoney(it.price)}</td><td>${fmtMoney(it.lineTotal)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="posRemoveFromCart(${i})">✕</button></td></tr>`).join('')}
  </tbody></table></div>`;
  posCalcTotals();
}
function posChangeQty(idx,d){
  const it=posCart[idx];if(!it)return;
  const nq=it.qty+d;if(nq<1)return;
  const p=products.find(pr=>pr.id===it.id);
  if(p&&nq>p.stock){showToast('Insufficient','error');return;}
  it.qty=nq;it.lineTotal=nq*it.price;posUpdateCart();
}
function posCalcTotals(){
  const st=posCart.reduce((s,i)=>s+i.lineTotal,0);
  const disc=parseFloat(document.getElementById('posDiscount')?.value)||0;
  const rate=settings.taxRate||VAT_RATE;
  const after=Math.max(0,st-disc);
  const tax=after*rate;
  const grand=after+tax;
  const paid=parseFloat(document.getElementById('posPaid')?.value)||0;
  const change=Math.max(0,paid-grand);
  const el=id=>document.getElementById(id);
  if(el('posSubtotal'))el('posSubtotal').value=st.toFixed(2);
  if(el('posTax'))el('posTax').value=tax.toFixed(2);
  if(el('posGrandTotal'))el('posGrandTotal').value=grand.toFixed(2);
  if(el('posChange'))el('posChange').value=change.toFixed(2);
  if(el('posStatus'))el('posStatus').value=(paid>=grand&&grand>0)?'Paid':(paid>0?'Partial':'Due');
  return {st,disc,tax,grand,paid,change};
}
function posCompleteSale(){
  if(!posCart.length){showToast('Cart empty','error');return;}
  const t=posCalcTotals();
  const cName=document.getElementById('posCustomer').value.trim();
  const cPhone=document.getElementById('posCustomerPhone').value.trim();
  const shop=document.getElementById('posShop').value;
  const payment=document.getElementById('posPayment').value;
  let cust=customers.find(c=>c.fullName===cName&&c.mobile===cPhone)||customers.find(c=>c.fullName===cName);
  if(!cust&&cName){cust={id:'C'+String(counters.customer++).padStart(3,'0'),fullName:cName,mobile:cPhone,membershipLevel:'Regular',loyaltyPoints:0,totalPurchases:0,dueBalance:0,createdAt:new Date().toISOString()};customers.push(cust);}
  for(const it of posCart){const p=products.find(pr=>pr.id===it.id);if(!p||p.stock<it.qty){showToast(`Insufficient: ${it.name}`,'error');return;}}
  const invNum=document.getElementById('posInvNumber').value;
  const invDate=document.getElementById('posInvDate').value;
  const cogs=posCart.reduce((s,i)=>s+(i.cost||0)*i.qty,0);
  const inv={id:'INV'+String(counters.invoice++).padStart(5,'0'),invoiceNumber:invNum,date:invDate,shop,customerId:cust?.id,customerName:cust?.fullName||'Walk-in',customerPhone:cust?.mobile||'',items:posCart.map(i=>({...i})),subtotal:t.st,discount:t.disc,tax:t.tax,grandTotal:t.grand,paid:t.paid,change:t.change,due:Math.max(0,t.grand-t.paid),paymentMethod:payment,status:t.paid>=t.grand?'Paid':(t.paid>0?'Partial':'Due'),cogs,salesman:currentUser?.name||'System',createdAt:new Date().toISOString()};
  invoices.push(inv);
  settings.nextInvoiceNumber=(settings.nextInvoiceNumber||1001)+1;
  posCart.forEach(it=>{const p=products.find(pr=>pr.id===it.id);if(p){p.stock-=it.qty;p.salesCount=(p.salesCount||0)+it.qty;stockMovements.push({id:'SM'+String(stockMovements.length+1).padStart(5,'0'),productId:p.id,productName:p.name,type:'SALE',qty:-it.qty,shop,reference:invNum,date:invDate,user:currentUser?.name||'System'});}});
  if(cust){cust.totalPurchases=(cust.totalPurchases||0)+t.grand;cust.loyaltyPoints=(cust.loyaltyPoints||0)+Math.floor(t.grand/100);cust.dueBalance=(cust.dueBalance||0)+Math.max(0,t.grand-t.paid);}
  if(payment==='eSewa')esewa.balance=(esewa.balance||0)+t.paid;
  logAudit('SALE',`${invNum} — ${fmtMoney(t.grand)}`);
  addNotification(`Sale ${invNum}: ${fmtMoney(t.grand)}`,'success');
  saveData(true);
  showToast(`✅ ${invNum}`,'success');
  if(confirm('Print invoice?'))posPrintInvoiceById(inv.id);
  posCart=[];renderPOS();
}
function posPrintInvoiceById(id){
  const inv=invoices.find(i=>i.id===id);if(!inv)return;
  const c=document.createElement('div');c.style.position='fixed';c.style.left='-9999px';
  c.innerHTML=`<div class="invoice-print" id="printArea">${buildInvoiceHTML(inv)}</div>`;
  document.body.appendChild(c);
  setTimeout(()=>{html2pdf().set({margin:10,filename:inv.invoiceNumber+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4'}}).from(document.getElementById('printArea')).save().then(()=>c.remove()).catch(()=>{window.print();c.remove();});},100);
}
function buildInvoiceHTML(inv){
  return `<div class="header"><div class="company"><h2>👜 MS <span>Bag Shop</span></h2><p>${esc(settings.address||ADDRESS)}<br>${esc(settings.phone||PHONE)}</p></div><div class="meta"><div><strong>INVOICE</strong></div><div>#${esc(inv.invoiceNumber)}</div><div>Date: ${esc(inv.date)}</div></div></div>
  <div class="customer"><div><span class="label">Customer:</span> ${esc(inv.customerName)}</div><div><span class="label">Phone:</span> ${esc(inv.customerPhone||'-')}</div></div>
  <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${inv.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${fmtMoney(i.price)}</td><td>${fmtMoney(i.lineTotal)}</td></tr>`).join('')}</tbody></table>
  <div class="totals"><div>Subtotal: ${fmtMoney(inv.subtotal)}</div><div>Discount: -${fmtMoney(inv.discount)}</div><div>VAT: ${fmtMoney(inv.tax)}</div><div class="grand">Total: ${fmtMoney(inv.grandTotal)}</div><div>Paid: ${fmtMoney(inv.paid)}</div><div>Due: ${fmtMoney(inv.due)}</div></div>
  <div class="footer">${esc(settings.receiptFooter||'Thank you!')}</div>`;
}
function posHoldSale(){
  if(!posCart.length){showToast('Empty','error');return;}
  heldSales.push({cart:JSON.parse(JSON.stringify(posCart)),customer:document.getElementById('posCustomer').value,shop:document.getElementById('posShop').value});
  posCart=[];posUpdateCart();showToast('📌 Held','success');
}
function posResumeSale(){
  if(!heldSales.length){showToast('None held','warning');return;}
  const s=heldSales.pop();posCart=s.cart;document.getElementById('posCustomer').value=s.customer||'';posUpdateCart();showToast('▶️ Resumed','success');
}

/* SHOP REPORTS — per-shop comparison with date range */
function renderShopReports(){
  document.getElementById('pageContent').innerHTML=`
    <div class="section-card">
      <div class="card-title">🏪 Shop Reports</div>
      <div class="report-filter">
        <div class="form-group"><label>Start Date</label><input type="date" id="srStart" value="${firstDayOfMonth()}"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="srEnd" value="${today()}"></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" style="width:100%;" onclick="runShopReport()">🔍 Run Report</button></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-secondary" style="width:100%;" onclick="exportShopReport()">📊 Export</button></div>
      </div>
      <div id="shopReportResult"></div>
    </div>`;
  runShopReport();
}
function runShopReport(){
  const start=document.getElementById('srStart').value;
  const end=document.getElementById('srEnd').value;
  const filtered=invoices.filter(i=>i.date>=start&&i.date<=end);
  const byShop={};
  shops.forEach(s=>{byShop[s.shopName]={sales:0,invoices:0,units:0,cash:0,card:0,esewa:0};});
  filtered.forEach(inv=>{
    if(!byShop[inv.shop])byShop[inv.shop]={sales:0,invoices:0,units:0,cash:0,card:0,esewa:0};
    byShop[inv.shop].sales+=inv.grandTotal;
    byShop[inv.shop].invoices++;
    byShop[inv.shop].units+=inv.items.reduce((s,i)=>s+i.qty,0);
    if(inv.paymentMethod==='Cash')byShop[inv.shop].cash+=inv.paid;
    else if(inv.paymentMethod==='Card')byShop[inv.shop].card+=inv.paid;
    else if(inv.paymentMethod==='eSewa')byShop[inv.shop].esewa+=inv.paid;
  });
  const totalSales=filtered.reduce((s,i)=>s+i.grandTotal,0);
  const totalInv=filtered.length;
  const totalUnits=filtered.reduce((s,i)=>s+i.items.reduce((ss,it)=>ss+it.qty,0),0);
  const shopRows=Object.entries(byShop).map(([name,d])=>`
    <tr>
      <td><strong>${esc(name)}</strong></td>
      <td>${d.invoices}</td>
      <td>${d.units}</td>
      <td>${fmtMoney(d.sales)}</td>
      <td>${fmtMoney(d.cash)}</td>
      <td>${fmtMoney(d.card)}</td>
      <td>${fmtMoney(d.esewa)}</td>
      <td>${totalSales>0?((d.sales/totalSales)*100).toFixed(1):'0'}%</td>
    </tr>`).join('');
  document.getElementById('shopReportResult').innerHTML=`
    <div class="kpi-grid" style="margin-top:14px;">
      <div class="kpi-card"><div class="kpi-label">Total Sales</div><div class="kpi-value gold">${fmtMoney(totalSales)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Invoices</div><div class="kpi-value">${totalInv}</div></div>
      <div class="kpi-card"><div class="kpi-label">Units Sold</div><div class="kpi-value">${totalUnits}</div></div>
      <div class="kpi-card"><div class="kpi-label">Shops Active</div><div class="kpi-value">${Object.keys(byShop).filter(k=>byShop[k].invoices>0).length}</div></div>
    </div>
    <div class="table-wrapper" style="margin-top:14px;"><table>
      <thead><tr><th>Shop</th><th>Invoices</th><th>Units</th><th>Sales</th><th>Cash</th><th>Card</th><th>eSewa</th><th>%</th></tr></thead>
      <tbody>${shopRows||'<tr class="empty-row"><td colspan="8">No data in this range</td></tr>'}</tbody>
    </table></div>`;
  window._lastShopReport=Object.entries(byShop).map(([name,d])=>({Shop:name,Invoices:d.invoices,Units:d.units,Sales:d.sales,Cash:d.cash,Card:d.card,eSewa:d.esewa}));
}
function exportShopReport(){
  if(!window._lastShopReport||!window._lastShopReport.length){showToast('Run report first','warning');return;}
  exportToExcel(window._lastShopReport,'shop-report-'+today());
}

/* ITEM REPORTS — per-product with date range */
function renderItemReports(){
  document.getElementById('pageContent').innerHTML=`
    <div class="section-card">
      <div class="card-title">🏷️ Item Reports</div>
      <div class="report-filter">
        <div class="form-group"><label>Start Date</label><input type="date" id="irStart" value="${firstDayOfMonth()}"></div>
        <div class="form-group"><label>End Date</label><input type="date" id="irEnd" value="${today()}"></div>
        <div class="form-group"><label>Category</label><select id="irCategory"><option value="">All Categories</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" style="width:100%;" onclick="runItemReport()">🔍 Run</button></div>
      </div>
      <div id="itemReportResult"></div>
    </div>`;
  runItemReport();
}
function runItemReport(){
  const start=document.getElementById('irStart').value;
  const end=document.getElementById('irEnd').value;
  const cat=document.getElementById('irCategory').value;
  const filtered=invoices.filter(i=>i.date>=start&&i.date<=end);
  const byProduct={};
  filtered.forEach(inv=>{
    inv.items.forEach(it=>{
      const p=products.find(pr=>pr.id===it.id);
      if(cat&&p&&p.category!==cat)return;
      const key=it.id;
      if(!byProduct[key])byProduct[key]={id:it.id,name:it.name,qty:0,revenue:0,cost:0,invoices:0};
      byProduct[key].qty+=it.qty;
      byProduct[key].revenue+=it.lineTotal;
      byProduct[key].cost+=(it.cost||0)*it.qty;
      byProduct[key].invoices++;
    });
  });
  const rows=Object.values(byProduct).sort((a,b)=>b.revenue-a.revenue).map(r=>{
    const profit=r.revenue-r.cost;
    const margin=r.revenue>0?(profit/r.revenue*100):0;
    return `<tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td>${r.invoices}</td>
      <td>${r.qty}</td>
      <td>${fmtMoney(r.revenue)}</td>
      <td>${fmtMoney(r.cost)}</td>
      <td style="color:${profit>=0?'var(--success)':'var(--danger)'}">${fmtMoney(profit)}</td>
      <td>${margin.toFixed(1)}%</td>
    </tr>`;
  }).join('');
  const totalRev=Object.values(byProduct).reduce((s,r)=>s+r.revenue,0);
  const totalCost=Object.values(byProduct).reduce((s,r)=>s+r.cost,0);
  const totalQty=Object.values(byProduct).reduce((s,r)=>s+r.qty,0);
  document.getElementById('itemReportResult').innerHTML=`
    <div class="kpi-grid" style="margin-top:14px;">
      <div class="kpi-card"><div class="kpi-label">Revenue</div><div class="kpi-value gold">${fmtMoney(totalRev)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Cost</div><div class="kpi-value">${fmtMoney(totalCost)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Profit</div><div class="kpi-value success">${fmtMoney(totalRev-totalCost)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Units</div><div class="kpi-value">${totalQty}</div></div>
    </div>
    <div class="table-wrapper" style="margin-top:14px;"><table>
      <thead><tr><th>Product</th><th>Invoices</th><th>Qty</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin</th></tr></thead>
      <tbody>${rows||'<tr class="empty-row"><td colspan="7">No sales in this range</td></tr>'}</tbody>
    </table></div>`;
  window._lastItemReport=Object.values(byProduct).map(r=>({Product:r.name,Invoices:r.invoices,Qty:r.qty,Revenue:r.revenue,Cost:r.cost,Profit:r.revenue-r.cost}));
}
function exportItemReport(){
  if(!window._lastItemReport||!window._lastItemReport.length){showToast('Run report first','warning');return;}
  exportToExcel(window._lastItemReport,'item-report-'+today());
}

function saveUser(){

  if(userAccounts.some(x=>x.username===u)){showToast('Exists','error');return;}
  userAccounts.push({id:'USR'+String(counters.user++).padStart(3,'0'),username:u,password:p,fullName:document.getElementById('uFullName').value.trim()||u,role:document.getElementById('uRole').value,email:document.getElementById('uEmail').value.trim(),status:'Active',staffId:null,lastLogin:null,createdAt:new Date().toISOString()});
  saveData(true);closeModal();showToast('✅','success');renderUsers();
}
function deleteUser(id){
  if(id===currentUser?.id){showToast('Cannot delete self','error');return;}
  if(!confirm('Delete?'))return;
  userAccounts=userAccounts.filter(u=>u.id!==id);
  saveData(true);renderUsers();
}

/* BACKUP */
function renderBackup(){
  document.getElementById('pageContent').innerHTML=`
    <div class="section-card">
      <div class="card-title">💾 Backup</div>
      <div class="btn-group">
        <button class="btn btn-gold" onclick="downloadBackup()">📥 Download</button>
        <button class="btn btn-secondary" onclick="document.getElementById('restoreFile').click()">📤 Restore</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreBackup(event)">
        <button class="btn btn-danger" onclick="resetAllData()">⚠️ Reset</button>
      </div>
    </div>`;
}
function downloadBackup(){
  const data=localStorage.getItem(STORAGE_KEY)||'{}';
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`msbag-backup-${Date.now()}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
function restoreBackup(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{JSON.parse(ev.target.result);localStorage.setItem(STORAGE_KEY,ev.target.result);showToast('✅ Restored','success');setTimeout(()=>location.reload(),1200);}
    catch(err){showToast('Invalid','error');}
  };
  r.readAsText(f);
}
function resetAllData(){
  if(!confirm('Factory reset?'))return;
  if(!confirm('Absolutely sure?'))return;
  localStorage.removeItem(STORAGE_KEY);location.reload();
}

/* SEARCH */
function renderSearch(){
  document.getElementById('pageContent').innerHTML=`
    <div class="section-card">
      <div class="card-title">🔍 Search</div>
      <div class="form-group"><input id="searchQuery" placeholder="Product, SKU, barcode, invoice, customer..." style="font-size:16px;padding:14px;" onkeydown="if(event.key==='Enter')performSearch()"></div>
      <div class="btn-group"><button class="btn btn-primary" onclick="performSearch()">🔍</button>
        <button class="btn btn-secondary" onclick="document.getElementById('searchQuery').value='';document.getElementById('searchResults').innerHTML=''">🗑️</button></div>
      <div id="searchResults" style="margin-top:14px;"></div>
    </div>`;
}
function performSearch(){
  const q=(document.getElementById('searchQuery')?.value||'').trim().toLowerCase();
  const r=document.getElementById('searchResults');
  if(!q){r.innerHTML='<p style="color:var(--text-light);">Enter a term</p>';return;}
  const items=[];
  products.forEach(p=>{if(p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').includes(q))items.push({type:'📦 Product',name:p.name,detail:`${fmtMoney(p.sellingPrice)} · Stock: ${p.stock}`,link:'products'});});
  customers.forEach(c=>{if(c.fullName.toLowerCase().includes(q)||(c.mobile||'').includes(q))items.push({type:'👤 Customer',name:c.fullName,detail:c.mobile||'',link:'customers'});});
  invoices.forEach(i=>{if(i.invoiceNumber.toLowerCase().includes(q)||(i.customerName||'').toLowerCase().includes(q))items.push({type:'🧾 Invoice',name:i.invoiceNumber,detail:`${fmtMoney(i.grandTotal)} · ${i.customerName}`,link:'invoices'});});
  if(!items.length){r.innerHTML='<p style="color:var(--text-light);">No results</p>';return;}
  r.innerHTML=`<div class="table-wrapper"><table><thead><tr><th>Type</th><th>Name</th><th>Details</th><th>Go</th></tr></thead><tbody>
    ${items.slice(0,25).map(i=>`<tr><td>${i.type}</td><td><strong>${esc(i.name)}</strong></td><td>${esc(i.detail)}</td><td><button class="btn btn-sm btn-secondary" onclick="navigateTo('${i.link}')">Go</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
